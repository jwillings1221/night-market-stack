<!DOCTYPE html>

<style>

  html, body { position: fixed; inset: 0; margin: 0; height: 100%; background: #12121f;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: relative; box-sizing: border-box; width: 100vw; height: 100vh;
    height: 100dvh; padding: max(6px, env(safe-area-inset-top))
      max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom))

  #stage::after { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none;
    background: repeating-linear-gradient(0deg,
      rgba(0, 0, 0, .13) 0 2px, transparent 2px 4px); }
  #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%;

  #hud > span { padding: 3px 7px; background: #1a1c2c; border: 2px solid #333c57; }
  #comboTag { color: #ffcd75; font-weight: 700; font-size: 13px; border-color: #ffcd75; }
  #flash { position: absolute; z-index: 5; inset: 0; opacity: 0;
    pointer-events: none; background: #fff; }
  #flash.danger { background: #b13e53; }
  #flash.active { animation: flash 80ms step-end; }
  #flash.danger.active { animation-duration: 140ms; }
  #floats { position: absolute; z-index: 6; inset: 0; overflow: hidden;
    pointer-events: none; }
  .float-label { position: absolute; transform: translate(-50%, -50%);
    font-weight: 700; font-size: 16px; line-height: 1; color: #ffcd75;
    text-shadow: 3px 3px 0 #1a1c2c; white-space: nowrap;

  .float-label.normal { font-size: 13px; color: #73eff7; }
  #mute { position: absolute; z-index: 20;
    top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right));
    width: 34px; height: 34px; margin: 0; padding: 0; border-radius: 0;
    border: 2px solid #333c57; background: #1a1c2c; color: #f4f4f4;
    font-size: 14px; line-height: 1; cursor: pointer; }
  #mute[aria-pressed="true"] { color: #b13e53; border-color: #b13e53; }
  #overlay { position: absolute; inset: 0; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 28px; overflow: hidden;

    color: #f4f4f4; text-align: center; z-index: 10; }
  #overlay > * { position: relative; }
  #overlay .kicker { margin: 0 0 10px; font-size: 10px; letter-spacing: .3em;
    color: #73eff7; text-indent: .3em; }
  #overlay h1 { margin: 0; font-size: clamp(28px, 8vw, 40px); letter-spacing: .06em;
    color: #ffcd75; text-shadow: 4px 4px 0 #b13e53; }

  #overlay p { margin: 16px 0 2px; color: #94b0c2; font-size: 13px; line-height: 1.9; }
  #overlay.hidden { display: none; }
  button { margin-top: 22px; padding: 10px 30px; font-size: 15px; border: 0;
    border-bottom: 4px solid #b13e53; border-radius: 0;
    background: #ffcd75; color: #1a1c2c; font-weight: 700;
    font-family: inherit; letter-spacing: .1em;
    cursor: pointer; touch-action: manipulation; }
  button:active { transform: translateY(2px); border-bottom-width: 2px; }
  #stage.shake-light { animation: shake-light 120ms steps(2, end); }
  #stage.shake-heavy { animation: shake-heavy 220ms steps(3, end); }
  @keyframes flash {
    0% { opacity: .78; }

  }
  @keyframes float-up {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(.8); }

  }
  @keyframes shake-light {
    0%, 100% { transform: translate3d(0, 0, 0); }
    50% { transform: translate3d(-2px, 1px, 0); }
  }
  @keyframes shake-heavy {
    0%, 100% { transform: translate3d(0, 0, 0); }
    20% { transform: translate3d(-6px, 3px, 0); }
    40% { transform: translate3d(6px, -3px, 0); }
    60% { transform: translate3d(-4px, -2px, 0); }
    80% { transform: translate3d(4px, 2px, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage.shake-light, #stage.shake-heavy { animation: none; }

  }

</style>

<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="360" height="640"></canvas>
    <canvas id="fx" width="360" height="640"></canvas>
    <div id="hud">
      <span id="scoreTag">分数 0</span>
      <span id="comboTag">连击 0</span>
      <span id="bestTag">最高 0</span>
    </div>
    <div id="flash"></div>
    <div id="floats" aria-live="polite"></div>
  </div>
  <button id="mute" type="button" aria-label="关闭声音" aria-pressed="false">🔊</button>
  <div id="overlay">
    <p class="kicker">PIXEL NIGHT MARKET</p>
    <h1>夜市叠叠高</h1>
    <div class="rule"></div>
    <p>点击屏幕，让小吃落下<br>叠得越高，分越高</p>
    <button id="start">开始</button>
  </div>
</div>
<script src="./logic.js"></script>
<script>
// ===== 1. 配置：想调手感，先改这里 =====
const W = 360, H = 640;
const CONFIG = {
  blockH: 28,        // 每块高度
  startW: 160,       // 第一块宽度
  startSpeed: 100,   // 初始左右移动速度（像素/秒）
  speedAdd: 3,       // 每叠一块加速
  maxSpeed: 300,     // 速度上限
  perfect: 12,       // 中心偏差 <= 12px 算 perfect
  minOverlap: 10,    // 重叠 < 10px 直接失败
  gap: 80,           // 当前块与牌堆的间距
  failFlashMs: 140,
  shakeLightMs: 120,
  shakeHeavyMs: 220,
  particleMax: 20,
  particlePerfect: 12,
  particleNormal: 5,
  particleFail: 20,
  audioVolume: 0.2,
};

// ===== 2. 状态 =====
const GameLogic = window.NightMarketLogic;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const scoreTag = document.getElementById('scoreTag');
const comboTag = document.getElementById('comboTag');
const bestTag = document.getElementById('bestTag');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start');
const wrap = document.getElementById('wrap');
const stage = document.getElementById('stage');
const fxCanvas = document.getElementById('fx');
const fxCtx = fxCanvas.getContext('2d');
const flash = document.getElementById('flash');
const floatLayer = document.getElementById('floats');
const muteBtn = document.getElementById('mute');

let state = null;
let particles = [];
let flashTimer = 0;
let shakeTimer = 0;
let pixelRatio = 1;

// 视觉和音频使用独立随机流，绝不消耗玩法的 Math.random()。
let fxSeed = (Date.now() ^ 0x9e3779b9) >>> 0;
function fxR() {
  fxSeed ^= fxSeed << 13;
  fxSeed ^= fxSeed >>> 17;
  fxSeed ^= fxSeed << 5;
  return (fxSeed >>> 0) / 4294967296;
}

function loadBest() {
  try { return Number(localStorage.getItem('best') || 0); } catch (e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem('best', String(v)); } catch (e) {}
}

function loadMuted() {
  try { return localStorage.getItem('muted') === '1'; } catch (e) { return false; }
}

function saveMuted(v) {
  try { localStorage.setItem('muted', v ? '1' : '0'); } catch (e) {}
}

class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.compressor = null;
    this.noiseBuffer = null;
    this.muted = loadMuted();
    this.renderButton();
  }

  ensure() {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!this.ctx && AudioCtor) {
      this.ctx = new AudioCtor();
      this.master = this.ctx.createGain();
      this.compressor = this.ctx.createDynamicsCompressor();
      this.compressor.threshold.value = -16;
      this.compressor.knee.value = 12;
      this.compressor.ratio.value = 3;
      this.compressor.attack.value = 0.003;
      this.compressor.release.value = 0.18;
      this.master.connect(this.compressor);
      this.compressor.connect(this.ctx.destination);
      this.applyVolume(0);
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    this.applyVolume(0.01);
  }

  applyVolume(seconds) {
    if (!this.ctx || !this.master) return;
    const target = this.muted ? 0 : CONFIG.audioVolume;
    const now = this.ctx.currentTime;
    if (seconds > 0) {
      this.master.gain.setTargetAtTime(target, now, seconds);
    } else {
      this.master.gain.setValueAtTime(target, now);
    }
  }

  toggle() {
    this.muted = !this.muted;
    saveMuted(this.muted);
    this.applyVolume(0.01);
    this.renderButton();
  }

  renderButton() {
    muteBtn.textContent = this.muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-pressed', String(this.muted));
    muteBtn.setAttribute('aria-label', this.muted ? '打开声音' : '关闭声音');
  }

  tone(freq, type, duration, volume, delay = 0, endFreq = freq) {
    if (!this.ctx || this.muted) return;
    const start = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, freq), start);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), start + duration);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(this.master);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  }

  noise(duration, volume, cutoff, delay = 0) {
    if (!this.ctx || this.muted) return;
    if (!this.noiseBuffer) {
      const length = Math.max(1, Math.floor(this.ctx.sampleRate * 0.5));
      this.noiseBuffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
      const data = this.noiseBuffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = fxR() * 2 - 1;
    }
    const start = this.ctx.currentTime + delay;
    const source = this.ctx.createBufferSource();
    const filter = this.ctx.createBiquadFilter();
    const gain = this.ctx.createGain();
    source.buffer = this.noiseBuffer;
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(cutoff, start);
    gain.gain.setValueAtTime(Math.max(0.0001, volume), start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(this.master);
    source.start(start);
    source.stop(start + duration + 0.02);
  }

  drop() {
    this.tone(170, 'triangle', 0.07, 0.11, 0, 105);
    this.noise(0.045, 0.035, 1100);
  }

  perfect() {
    this.tone(660, 'sine', 0.18, 0.1);
    this.tone(880, 'sine', 0.2, 0.08, 0.035);
    this.tone(1100, 'triangle', 0.22, 0.055, 0.07);
  }

  combo(level) {
    const freq = 520 + Math.min(level, 10) * 38;
    this.tone(freq, 'triangle', 0.16, 0.07, 0.08, freq * 1.18);
  }

  fail() {
    this.tone(220, 'sawtooth', 0.34, 0.1, 0, 55);
    this.noise(0.16, 0.07, 550);
  }
}

const audio = new AudioEngine();

function clearEffects() {
  particles = [];
  fxCtx.clearRect(0, 0, W, H);
  flash.classList.remove('active', 'danger');
  clearTimeout(flashTimer);
  clearTimeout(shakeTimer);
  stage.classList.remove('shake-light', 'shake-heavy');
}

function triggerFlash(kind, duration) {
  clearTimeout(flashTimer);
  flash.classList.remove('active', 'danger');
  void flash.offsetWidth;
  if (kind === 'danger') flash.classList.add('danger');
  flash.classList.add('active');
  flashTimer = window.setTimeout(() => {
    flash.classList.remove('active', 'danger');
  }, duration);
}

function shakeScreen(kind, duration) {
  clearTimeout(shakeTimer);
  stage.classList.remove('shake-light', 'shake-heavy');
  void stage.offsetWidth;
  stage.classList.add(kind === 'heavy' ? 'shake-heavy' : 'shake-light');
  shakeTimer = window.setTimeout(() => {
    stage.classList.remove('shake-light', 'shake-heavy');
  }, duration);
}

function addParticles(x, y, colors, count) {
  for (let i = 0; i < count && particles.length < CONFIG.particleMax; i++) {
    particles.push({
      x,
      y,
      vx: (fxR() - 0.5) * 260,
      vy: -70 - fxR() * 210,
      gravity: 360 + fxR() * 160,
      life: 0.35 + fxR() * 0.4,
      maxLife: 0.75,
      size: 2 + fxR() * 4,
      color: colors[Math.floor(fxR() * colors.length)],
      spin: (fxR() - 0.5) * 10,
      angle: fxR() * Math.PI,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.angle += p.spin * dt;
  }
}

function drawParticles() {
  fxCtx.clearRect(0, 0, W, H);
  for (const p of particles) {
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.angle);
    fxCtx.fillStyle = p.color;
    fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    fxCtx.restore();
  }
}

function floatText(text, x, y, normal = false) {
  const label = document.createElement('span');
  label.className = 'float-label' + (normal ? ' normal' : '');
  label.textContent = text;
  label.style.left = Math.max(8, Math.min(92, x / W * 100)) + '%';
  label.style.top = Math.max(18, Math.min(82, y / H * 100)) + '%';
  label.addEventListener('animationend', () => label.remove(), { once: true });
  floatLayer.appendChild(label);
}

function screenPoint(blockOrX, y) {
  const x = typeof blockOrX === 'number'
    ? blockOrX
    : blockOrX.x + blockOrX.w / 2;
  const worldY = typeof blockOrX === 'number'
    ? y
    : blockOrX.y + CONFIG.blockH / 2;
  return { x, y: worldY + (state ? state.cameraY : 0) };
}

function reset() {
  clearEffects();
  state = GameLogic.createRoundState({
    width: W,
    height: H,
    config: CONFIG,
    best: loadBest(),
    random: Math.random,
    kindForIndex: snackKindForIndex,
  });
  updateHud();
}

// ===== 3. 输入 =====
wrap.addEventListener('pointerdown', () => {
  audio.ensure();
  // 整个屏幕都能落块，但开始/重开遮罩上的点击不能穿透到游戏。
  if (!state || state.mode !== 'playing' || !overlay.classList.contains('hidden')) return;
  const now = performance.now();
  if (now - state.lastDropAt < 120) return; // 防移动端双击一次消费两块
  state.lastDropAt = now;
  drop();
});

startBtn.addEventListener('click', () => {
  audio.ensure();
  overlay.classList.add('hidden');
  wrap.classList.add('playing');
  reset();
});

muteBtn.addEventListener('pointerdown', (event) => {
  event.stopPropagation();
  audio.ensure();
});

muteBtn.addEventListener('click', (event) => {
  event.stopPropagation();
  audio.ensure();
  audio.toggle();
});

// ===== 4. 核心逻辑 =====
function drop() {
  const cur = state.current;
  const top = state.blocks[state.blocks.length - 1];
  const judgement = GameLogic.judge(cur, top, CONFIG);

  if (judgement.status === 'fail') {
    return gameOver();
  }

  // 新块就是重叠部分，保留原版切割规则。
  const newBlock = {
    x: judgement.left,
    y: top.y - CONFIG.blockH,
    w: judgement.width,
    h: CONFIG.blockH,
    kind: snackKindForIndex(state.blocks.length),
  };
  state.blocks.push(newBlock);

  const score = GameLogic.scoreFor(judgement.status, state.combo);
  state.combo = score.combo;
  state.score += score.delta;
  const perfect = judgement.status === 'perfect';

  // 镜头跟随 + 加速
  state.cameraY = Math.max(0, (state.blocks.length - 8) * CONFIG.blockH);
  state.speed = Math.min(CONFIG.maxSpeed, state.speed + CONFIG.speedAdd);

  const effectPoint = screenPoint(newBlock);
  audio.drop();
  if (perfect) {
    audio.perfect();
    if (state.combo >= 2) audio.combo(state.combo);
    shakeScreen('light', CONFIG.shakeLightMs);
    addParticles(
      effectPoint.x,
      effectPoint.y,
      ['#ffcd75', '#f4f4f4', '#73eff7'],
      CONFIG.particlePerfect,
    );
    floatText('PERFECT +1', effectPoint.x, effectPoint.y - 8);
  } else {
    addParticles(
      effectPoint.x,
      effectPoint.y,
      ['#73eff7', '#41a6f6', '#f4f4f4'],
      CONFIG.particleNormal,
    );
    floatText('+5', effectPoint.x, effectPoint.y - 6, true);
  }

  // 下一块：宽度跟当前顶层一致
  state.current = {
    x: Math.random() * (W - newBlock.w),
    y: newBlock.y - CONFIG.blockH - CONFIG.gap,
    w: newBlock.w,
    h: CONFIG.blockH,
    kind: snackKindForIndex(state.blocks.length),
    dir: Math.random() < 0.5 ? 1 : -1,
  };

  updateHud();
}

function gameOver() {
  const effectPoint = screenPoint(state.current);
  state.mode = 'over';
  if (state.score > state.best) {
    state.best = state.score;
    saveBest(state.best);
  }
  audio.fail();
  triggerFlash('danger', CONFIG.failFlashMs);
  shakeScreen('heavy', CONFIG.shakeHeavyMs);
  addParticles(
    effectPoint.x,
    effectPoint.y,
    ['#b13e53', '#ef7d57', '#ffcd75'],
    CONFIG.particleFail,
  );

  window.setTimeout(() => {
    overlay.classList.remove('hidden');
    wrap.classList.remove('playing');
    overlay.innerHTML =
      '<p class="kicker">GAME OVER</p>' +
      '<h1>本摊打烊</h1>' +
      '<div class="rule"></div>' +
      '<p>分数 ' + Math.floor(state.score) + ' · 最高 ' + Math.floor(state.best) + '</p>' +
      '<button id="again">再来一局</button>';
    document.getElementById('again').onclick = () => {
      overlay.classList.add('hidden');
      wrap.classList.add('playing');
      reset();
    };
  }, CONFIG.failFlashMs);
  updateHud();
}

function updateHud() {
  if (!state) return;
  scoreTag.textContent = '分数 ' + Math.floor(state.score);
  comboTag.textContent = '连击 ' + state.combo;
  bestTag.textContent = '最高 ' + Math.floor(state.best);
}

const SNACK_KINDS = ['tanghulu', 'eggette', 'lemonTea'];
const STARS = Array.from({ length: 46 }, (_, i) => ({
  x: (i * 79 + 13) % W,
  y: 10 + ((i * 53 + i * i * 11) % 268),
  r: i % 7 === 0 ? 1.6 : 0.7 + (i % 3) * 0.22,
  a: 0.16 + (i % 6) * 0.07,
  ph: (i % 13) * 0.48,
}));

// 稳定伪随机：同一个方块每帧必须得到同样的细节，否则会闪。
function hash01(n) {
  const v = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return v - Math.floor(v);
}

const FLIES = Array.from({ length: 14 }, (_, i) => ({
  x: 18 + ((i * 71) % 324),
  y: 356 + ((i * 53) % 218),
  ph: i * 0.9,
  r: 0.8 + (i % 3) * 0.35,
}));

function drawFireflies(c, time) {
  for (const f of FLIES) {
    const x = f.x + Math.sin(time / 2600 + f.ph) * 12;
    const y = f.y + Math.cos(time / 3100 + f.ph * 1.3) * 8;
    const a = 0.22 + 0.34 * (0.5 + 0.5 * Math.sin(time / 900 + f.ph));
    c.fillStyle = 'rgba(255, 196, 110, ' + (a * 0.16).toFixed(3) + ')';
    c.beginPath();
    c.arc(x, y, f.r * 5, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = 'rgba(255, 228, 162, ' + a.toFixed(3) + ')';
    c.beginPath();
    c.arc(x, y, f.r, 0, Math.PI * 2);
    c.fill();
  }
}

function snackKindForIndex(index) {
  return SNACK_KINDS[index % SNACK_KINDS.length];
}

function roundRectPath(c, x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + radius, y);
  c.lineTo(x + w - radius, y);
  c.quadraticCurveTo(x + w, y, x + w, y + radius);
  c.lineTo(x + w, y + h - radius);
  c.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  c.lineTo(x + radius, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - radius);
  c.lineTo(x, y + radius);
  c.quadraticCurveTo(x, y, x + radius, y);
  c.closePath();
}

// ===== 像素美术层 =====
const PX = {
  bg: '#1a1c2c', bg2: '#29366f', d: '#333c57', s: '#566c86', l: '#94b0c2',
  w: '#f4f4f4', r: '#b13e53', R: '#ef7d57', y: '#ffcd75', g: '#a7f070',
  b: '#41a6f6', c: '#73eff7', p: '#5d275d', br: '#8f563b', db: '#663931',
};

function px(x, y, w, h, col) {
  ctx.fillStyle = col;
  ctx.fillRect(
    Math.round(x), Math.round(y),
    Math.max(1, Math.round(w)), Math.max(1, Math.round(h)),
  );
}

function drawLantern(c, x, y, phase, time, scale = 1) {
  const sway = Math.round(Math.sin(time / 1100 + phase) * 1.5);
  x += sway;
  const S = 4;
  const rx = 9 * scale;
  const ry = 11 * scale;

  c.fillStyle = 'rgba(255, 205, 117, .07)';
  c.beginPath();
  c.arc(x, y, 30 * scale, 0, Math.PI * 2);
  c.fill();

  px(x - 1, y - 34 * scale, 2, 12 * scale, PX.br);
  px(x - 7 * scale, y - 15 * scale, 14 * scale, 3 * scale, PX.br);

  for (let r = -ry; r < ry; r += S) {
    const k = Math.sqrt(Math.max(0, 1 - (r * r) / (ry * ry)));
    const w = Math.max(2, Math.round((2 * rx * k) / S) * S);
    const col = r < -ry * 0.45 ? PX.r : r > ry * 0.45 ? '#7a1f2e' : PX.R;
    px(x - w / 2, y + r, w, S, col);
  }

  px(x - 1, y - ry, 1, ry * 2, 'rgba(26, 28, 44, .45)');
  px(x + 1, y - ry, 1, ry * 2, 'rgba(26, 28, 44, .25)');
  px(x - 1, y + 15 * scale, 2, 5 * scale, PX.y);
  px(x - 4 * scale, y + 20 * scale, 8 * scale, 2 * scale, PX.y);
}

function drawStringLights(c, x0, y0, x1, y1, sag, time, count) {
  let ax = x0;
  let ay = y0;
  for (let i = 1; i <= count; i++) {
    const t = i / count;
    const x = x0 + (x1 - x0) * t;
    const y = y0 + (y1 - y0) * t + Math.sin(Math.PI * t) * sag;
    const steps = Math.max(1, Math.round(Math.abs(x - ax)));
    for (let s = 0; s < steps; s++) {
      px(ax + ((x - ax) * s) / steps, ay + ((y - ay) * s) / steps, 1, 1, PX.bg2);
    }
    ax = x;
    ay = y;
    const tw = 0.65 + 0.35 * Math.sin(time / 700 + i * 1.9);
    px(x - 2, y + 4, 4, 2, tw > 0.8 ? 'rgba(255, 205, 117, .22)' : 'rgba(255, 205, 117, .12)');
    px(x - 1, y + 2, 2, 2, tw > 0.8 ? PX.y : PX.br);
  }
}

function drawNightMarket(time) {
  px(0, 0, W, H, PX.bg);
  px(0, 0, W, 64, '#14162a');
  px(0, 64, W, 46, '#20233d');
  px(0, 110, W, 30, '#1d2240');

  for (const s of STARS) {
    if (Math.sin(time / 900 + s.ph) > -0.55) {
      px(s.x, s.y, 2, 2, s.a > 0.35 ? PX.w : PX.c);
    }
  }

  for (let y = -20; y <= 20; y += 4) {
    for (let x = -20; x <= 20; x += 4) {
      if (x * x + y * y < 300) {
        px(300 + x, 96 + y, 4, 4, x < -8 && y < 0 ? '#f0b860' : PX.y);
      }
    }
  }

  drawStringLights(ctx, -8, 62, 368, 84, 26, time, 11);
  drawStringLights(ctx, -8, 130, 368, 116, 32, time, 9);

  const sky = [
    [0, 300, 62, 64], [54, 268, 46, 96], [100, 312, 72, 52],
    [172, 286, 54, 78], [220, 306, 66, 58], [286, 272, 50, 92],
  ];
  for (const b of sky) {
    px(b[0], b[1], b[2], b[3], PX.d);
    for (let i = 8; i < b[2] - 6; i += 12) {
      for (let j = 10; j < b[3] - 8; j += 14) {
        if ((i + j) % 3) px(b[0] + i, b[1] + j, 4, 4, PX.y);
      }
    }
  }

  px(0, 600, W, 40, PX.bg);
  px(0, 600, W, 3, PX.br);
  px(0, 603, W, 9, PX.d);
  for (let i = 0; i < 6; i++) {
    px(0, 616 + i * 4, W, 2, i % 2 ? PX.bg : PX.d);
  }

  drawLantern(ctx, 30, 226, 0, time, 1);
  drawLantern(ctx, 331, 198, Math.PI, time, 0.9);
}

function drawTray(c, block, moving) {
  const y = block.y + block.h - 6;
  px(block.x, y, block.w, 6, PX.db);
  px(block.x, y, block.w, 2, PX.br);
  px(block.x, y + 5, block.w, 1, 'rgba(0, 0, 0, .45)');
}

function drawTanghulu(c, block, moving) {
  const left = block.x + 3;
  const right = block.x + block.w - 3;
  const cy = block.y + 12;

  px(left - 4, cy + 4, right - left + 8, 1, PX.br);

  const n = Math.max(2, Math.round(block.w / 14));
  const gap = (right - left) / n;
  for (let i = 0; i < n; i++) {
    const cx = Math.round(left + gap * (i + 0.5));
    px(cx - 4, cy - 4, 8, 8, PX.r);
    px(cx - 4, cy - 4, 4, 2, PX.R);
    px(cx - 2, cy - 3, 2, 2, '#ff9a8a');
    px(cx + 2, cy + 2, 2, 2, '#7a1f2e');
  }
}

function drawEggette(c, block, moving) {
  const left = block.x + 3;
  const right = block.x + block.w - 3;
  const top = block.y + 3;
  const bottom = block.y + block.h - 6;

  const n = Math.max(1, Math.round(block.w / 18));
  const slot = (right - left) / n;
  for (let i = 0; i < n; i++) {
    const cx = left + slot * (i + 0.5);
    const w = Math.min(16, Math.max(8, slot - 2));
    const x = Math.round(cx - w / 2);
    px(x, top, w, bottom - top, PX.br);
    px(x + 2, top + 2, w - 4, bottom - top - 4, PX.y);
    for (let r = 0; r < 2; r++) {
      for (let k = 0; k < 2; k++) {
        px(x + 4 + k * 6, top + 4 + r * 6, 3, 3, PX.br);
      }
    }
  }
}

function drawLemonTea(c, block, moving) {
  const left = block.x + 3;
  const right = block.x + block.w - 3;
  const base = block.y + block.h - 6;

  const n = Math.max(1, Math.round(block.w / 18));
  const slot = (right - left) / n;
  for (let i = 0; i < n; i++) {
    const cx = Math.round(left + slot * (i + 0.5));
    const w = 10;
    const h = 16;
    const x = cx - 5;
    const y = base - h;

    px(x - 1, y, w + 2, h, PX.d);
    px(x, y + 2, w, h - 2, PX.b);
    px(x + 1, y + 6, w - 2, h - 7, PX.y);
    px(x - 2, y - 2, w + 4, 3, PX.w);
    px(x + 2, y + 7, 3, 3, PX.w);
    px(x + 5, y + 10, 3, 2, PX.y);
    px(x + 6, y - 5, 2, 5, PX.r);
  }
}

function drawSnack(c, block, moving) {
  if (moving) {
    px(block.x - 2, block.y + block.h, block.w + 4, 2, 'rgba(0, 0, 0, .35)');
  }
  drawTray(c, block, moving);
  if (block.kind === 'tanghulu') drawTanghulu(c, block, moving);
  else if (block.kind === 'lemonTea') drawLemonTea(c, block, moving);
  else drawEggette(c, block, moving);
  px(block.x, block.y + block.h, block.w, 1, 'rgba(0, 0, 0, .35)');
}

// ===== 5. 主循环 =====
let last = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;

  if (state && state.mode === 'playing') {
    const cur = state.current;
    cur.x += cur.dir * state.speed * dt;
    if (cur.x < 0) { cur.x = 0; cur.dir = 1; }
    if (cur.x + cur.w > W) { cur.x = W - cur.w; cur.dir = -1; }
  }

  draw(t);
  updateParticles(dt);
  drawParticles();
  requestAnimationFrame(loop);
}

const IDLE_BLOCKS = [
  { x: 96, y: H - 60, w: 168, h: CONFIG.blockH, kind: 'tanghulu' },
  { x: 108, y: H - 88, w: 144, h: CONFIG.blockH, kind: 'eggette' },
  { x: 118, y: H - 116, w: 124, h: CONFIG.blockH, kind: 'lemonTea' },
  { x: 128, y: H - 144, w: 104, h: CONFIG.blockH, kind: 'tanghulu' },
];

function draw(time) {
  ctx.clearRect(0, 0, W, H);
  drawNightMarket(time);
  if (!state) {
    // 开始页：底部摆一组静态小吃，当作摊位展示
    for (const b of IDLE_BLOCKS) drawSnack(ctx, b, false);
    return;
  }

  ctx.save();
  ctx.translate(0, state.cameraY);   // 镜头跟随牌堆向上

  // 已叠好的块
  for (const b of state.blocks) {
    drawSnack(ctx, b, false);
  }

  // 当前块
  if (state.mode === 'playing') {
    drawSnack(ctx, state.current, true);
  }

  ctx.restore();
}

// ===== 6. 自适应缩放（保持 9:16，不变形） =====
function fitCanvas() {
  const wrapStyle = getComputedStyle(wrap);
  const safeWidth =
    wrap.clientWidth -
    parseFloat(wrapStyle.paddingLeft) -
    parseFloat(wrapStyle.paddingRight);
  const safeHeight =
    wrap.clientHeight -
    parseFloat(wrapStyle.paddingTop) -
    parseFloat(wrapStyle.paddingBottom);
  const scale = Math.max(0.1, Math.min(safeWidth / W, safeHeight / H));
  stage.style.width = (W * scale) + 'px';
  stage.style.height = (H * scale) + 'px';
  pixelRatio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const pixelWidth = Math.round(W * pixelRatio);
  const pixelHeight = Math.round(H * pixelRatio);
  for (const surface of [canvas, fxCanvas]) {
    if (surface.width !== pixelWidth || surface.height !== pixelHeight) {
      surface.width = pixelWidth;
      surface.height = pixelHeight;
    }
  }
  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  fxCtx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ===== 7. 启动 =====
// 开始页只画夜景，不画牌堆；点击"开始"后 reset() 才建立状态。
state = null;
requestAnimationFrame(loop);
</script>
