<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>夜市叠叠高 v0.3.1</title>
<style>
  html, body { position: fixed; inset: 0; margin: 0; height: 100%; background: #071225;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: relative; box-sizing: border-box; width: 100vw; height: 100vh;
    height: 100dvh; padding: max(6px, env(safe-area-inset-top))
      max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom))
      max(6px, env(safe-area-inset-left));
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 45%, #18234a 0%, #070b1c 72%);
    touch-action: none; }
  #stage { position: relative; width: 360px; height: 640px; flex: none;
    overflow: hidden; border-radius: 14px; box-shadow: 0 0 0 1px rgba(112, 230, 255, .1),
      0 20px 60px rgba(0, 0, 0, .45), 0 0 34px rgba(88, 85, 210, .14);
    background: #081329; transform: translate3d(0, 0, 0); will-change: transform;
    touch-action: none; }
  #stage canvas { position: absolute; inset: 0; display: block;
    width: 100%; height: 100%; background: transparent; touch-action: none; }
  #game { z-index: 1; }
  #stage #fx { z-index: 2; pointer-events: none; background: transparent; }
  #hud { position: absolute; z-index: 3; top: 12px; left: 64px; right: 64px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    color: #e7ddbd; font-size: 14px; pointer-events: none;
    text-shadow: 0 2px 8px #000; white-space: nowrap; }
  #comboTag { color: #ffd166; font-size: 26px; font-weight: 900;
    letter-spacing: .5px; text-shadow: 0 0 12px rgba(255, 209, 102, .65),
      0 2px 8px #000; }
  #flash { position: absolute; z-index: 4; inset: 0; opacity: 0;
    pointer-events: none; background: #fff; }
  #flash.danger { background: #ff3d55; }
  #flash.active { animation: flash 80ms ease-out; }
  #flash.danger.active { animation-duration: 140ms; }
  #floats { position: absolute; z-index: 5; inset: 0; overflow: hidden;
    pointer-events: none; }
  .float-label { position: absolute; transform: translate(-50%, -50%);
    font-weight: 900; font-size: 24px; line-height: 1;
    color: #fffbdc; text-shadow: 0 2px 0 #4a2a00, 0 0 12px #ffd166;
    white-space: nowrap; animation: float-up 700ms ease-out forwards; }
  .float-label.normal { font-size: 20px; color: #bff6ff;
    text-shadow: 0 2px 0 #06445a, 0 0 10px #90e0ef; }
  #mute { position: absolute; z-index: 20;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    width: 44px; height: 44px; margin: 0; padding: 0; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .28);
    background: rgba(25, 12, 31, .78); color: #fff; font-size: 20px;
    line-height: 1; box-shadow: 0 4px 14px rgba(0, 0, 0, .32);
    cursor: pointer; backdrop-filter: blur(8px); }
  #mute[aria-pressed="true"] { color: #ff9baa; }
  #overlay { position: absolute; inset: 0; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 28px; overflow: hidden;
    background: radial-gradient(circle at 50% 38%, rgba(75, 41, 103, .87),
      rgba(6, 11, 28, .95) 64%);
    color: #fff; text-align: center; z-index: 10; }
  #overlay::before { content: ""; position: absolute; inset: 8% 5%; pointer-events: none;
    background: radial-gradient(circle at 14% 18%, rgba(255, 87, 82, .22), transparent 24%),
      radial-gradient(circle at 88% 22%, rgba(86, 220, 255, .16), transparent 26%);
    filter: blur(8px); }
  #overlay > * { position: relative; }
  #overlay h1 { margin: 0; font-size: clamp(34px, 9vw, 48px); letter-spacing: .08em;
    color: #ffe59a; text-shadow: 0 0 22px rgba(255, 189, 81, .48), 0 4px 0 #5a2b16; }
  #overlay p { margin: 22px 0 2px; color: #f2e9dc; font-size: 17px; line-height: 1.8; }
  #overlay.hidden { display: none; }
  button { margin-top: 16px; padding: 12px 28px; font-size: 18px; border: 0;
    border-radius: 999px; background: linear-gradient(135deg, #ffe28a, #ffb85c);
    color: #2a1830; font-weight: 800; box-shadow: 0 8px 24px rgba(255, 173, 76, .3);
    cursor: pointer; touch-action: manipulation; }
  #stage.shake-light { animation: shake-light 120ms ease-out; }
  #stage.shake-heavy { animation: shake-heavy 220ms ease-out; }
  @keyframes flash {
    0% { opacity: .78; }
    100% { opacity: 0; }
  }
  @keyframes float-up {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(.72); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    100% { opacity: 0; transform: translate(-50%, -170%) scale(.96); }
  }
  @keyframes shake-light {
    0%, 100% { transform: translate3d(0, 0, 0); }
    25% { transform: translate3d(-2px, 1px, 0); }
    50% { transform: translate3d(2px, -1px, 0); }
    75% { transform: translate3d(-1px, 0, 0); }
  }
  @keyframes shake-heavy {
    0%, 100% { transform: translate3d(0, 0, 0); }
    15% { transform: translate3d(-7px, 3px, 0); }
    30% { transform: translate3d(7px, -3px, 0); }
    45% { transform: translate3d(-5px, -2px, 0); }
    60% { transform: translate3d(5px, 2px, 0); }
    75% { transform: translate3d(-2px, 1px, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage.shake-light, #stage.shake-heavy { animation: none; }
    #flash.active { animation: none; opacity: 0; }
    .float-label { animation-duration: 360ms; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="360" height="640"></canvas>
    <canvas id="fx" width="360" height="640"></canvas>
    <div id="hud">
      <span id="scoreTag">分数 0</span>
      <span id="comboTag">连击 0</span>
      <span id="bestTag">最高 0</span>
    </div>
    <div id="flash"></div>
    <div id="floats" aria-live="polite"></div>
  </div>
  <button id="mute" type="button" aria-label="关闭声音" aria-pressed="false">🔊</button>
  <div id="overlay">
    <h1>夜市叠叠高</h1>
    <p>点击屏幕，让小吃落下<br>叠得越高，分越高</p>
    <button id="start">开始</button>
  </div>
</div>
<script>
// ===== 1. 配置：想调手感，先改这里 =====
const W = 360, H = 640;
const CONFIG = {
  blockH: 28,        // 每块高度
  startW: 160,       // 第一块宽度
  startSpeed: 100,   // 初始左右移动速度（像素/秒）
  speedAdd: 3,       // 每叠一块加速
  maxSpeed: 300,     // 速度上限
  perfect: 12,       // 中心偏差 <= 12px 算 perfect
  minOverlap: 10,    // 重叠 < 10px 直接失败
  gap: 80,           // 当前块与牌堆的间距
  perfectFlashMs: 80,
  failFlashMs: 140,
  shakeLightMs: 120,
  shakeHeavyMs: 220,
  particleMax: 20,
  particlePerfect: 12,
  particleNormal: 5,
  particleFail: 20,
  audioVolume: 0.2,
};

// ===== 2. 状态 =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const scoreTag = document.getElementById('scoreTag');
const comboTag = document.getElementById('comboTag');
const bestTag = document.getElementById('bestTag');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start');
const wrap = document.getElementById('wrap');
const stage = document.getElementById('stage');
const fxCanvas = document.getElementById('fx');
const fxCtx = fxCanvas.getContext('2d');
const flash = document.getElementById('flash');
const floatLayer = document.getElementById('floats');
const muteBtn = document.getElementById('mute');

let state = null;
let particles = [];
let flashTimer = 0;
let shakeTimer = 0;
let pixelRatio = 1;

// 视觉和音频使用独立随机流，绝不消耗玩法的 Math.random()。
let fxSeed = (Date.now() ^ 0x9e3779b9) >>> 0;
function fxR() {
  fxSeed ^= fxSeed << 13;
  fxSeed ^= fxSeed >>> 17;
  fxSeed ^= fxSeed << 5;
  return (fxSeed >>> 0) / 4294967296;
}

function loadBest() {
  try { return Number(localStorage.getItem('best') || 0); } catch (e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem('best', String(v)); } catch (e) {}
}

function loadMuted() {
  try { return localStorage.getItem('muted') === '1'; } catch (e) { return false; }
}

function saveMuted(v) {
  try { localStorage.setItem('muted', v ? '1' : '0'); } catch (e) {}
}

class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.compressor = null;
    this.noiseBuffer = null;
    this.muted = loadMuted();
    this.renderButton();
  }

  ensure() {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!this.ctx && AudioCtor) {
      this.ctx = new AudioCtor();
      this.master = this.ctx.createGain();
      this.compressor = this.ctx.createDynamicsCompressor();
      this.compressor.threshold.value = -16;
      this.compressor.knee.value = 12;
      this.compressor.ratio.value = 3;
      this.compressor.attack.value = 0.003;
      this.compressor.release.value = 0.18;
      this.master.connect(this.compressor);
      this.compressor.connect(this.ctx.destination);
      this.applyVolume(0);
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    this.applyVolume(0.01);
  }

  applyVolume(seconds) {
    if (!this.ctx || !this.master) return;
    const target = this.muted ? 0 : CONFIG.audioVolume;
    const now = this.ctx.currentTime;
    if (seconds > 0) {
      this.master.gain.setTargetAtTime(target, now, seconds);
    } else {
      this.master.gain.setValueAtTime(target, now);
    }
  }

  toggle() {
    this.muted = !this.muted;
    saveMuted(this.muted);
    this.applyVolume(0.01);
    this.renderButton();
  }

  renderButton() {
    muteBtn.textContent = this.muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-pressed', String(this.muted));
    muteBtn.setAttribute('aria-label', this.muted ? '打开声音' : '关闭声音');
  }

  tone(freq, type, duration, volume, delay = 0, endFreq = freq) {
    if (!this.ctx || this.muted) return;
    const start = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, freq), start);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), start + duration);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(this.master);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  }

  noise(duration, volume, cutoff, delay = 0) {
    if (!this.ctx || this.muted) return;
    if (!this.noiseBuffer) {
      const length = Math.max(1, Math.floor(this.ctx.sampleRate * 0.5));
      this.noiseBuffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
      const data = this.noiseBuffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = fxR() * 2 - 1;
    }
    const start = this.ctx.currentTime + delay;
    const source = this.ctx.createBufferSource();
    const filter = this.ctx.createBiquadFilter();
    const gain = this.ctx.createGain();
    source.buffer = this.noiseBuffer;
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(cutoff, start);
    gain.gain.setValueAtTime(Math.max(0.0001, volume), start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(this.master);
    source.start(start);
    source.stop(start + duration + 0.02);
  }

  drop() {
    this.tone(170, 'triangle', 0.07, 0.11, 0, 105);
    this.noise(0.045, 0.035, 1100);
  }

  perfect() {
    this.tone(660, 'sine', 0.18, 0.1);
    this.tone(880, 'sine', 0.2, 0.08, 0.035);
    this.tone(1100, 'triangle', 0.22, 0.055, 0.07);
  }

  combo(level) {
    const freq = 520 + Math.min(level, 10) * 38;
    this.tone(freq, 'triangle', 0.16, 0.07, 0.08, freq * 1.18);
  }

  fail() {
    this.tone(220, 'sawtooth', 0.34, 0.1, 0, 55);
    this.noise(0.16, 0.07, 550);
  }
}

const audio = new AudioEngine();

function clearEffects() {
  particles = [];
  fxCtx.clearRect(0, 0, W, H);
  flash.classList.remove('active', 'danger');
  clearTimeout(flashTimer);
  clearTimeout(shakeTimer);
  stage.classList.remove('shake-light', 'shake-heavy');
}

function triggerFlash(kind, duration) {
  clearTimeout(flashTimer);
  flash.classList.remove('active', 'danger');
  void flash.offsetWidth;
  if (kind === 'danger') flash.classList.add('danger');
  flash.classList.add('active');
  flashTimer = window.setTimeout(() => {
    flash.classList.remove('active', 'danger');
  }, duration);
}

function shakeScreen(kind, duration) {
  clearTimeout(shakeTimer);
  stage.classList.remove('shake-light', 'shake-heavy');
  void stage.offsetWidth;
  stage.classList.add(kind === 'heavy' ? 'shake-heavy' : 'shake-light');
  shakeTimer = window.setTimeout(() => {
    stage.classList.remove('shake-light', 'shake-heavy');
  }, duration);
}

function addParticles(x, y, colors, count) {
  for (let i = 0; i < count && particles.length < CONFIG.particleMax; i++) {
    particles.push({
      x,
      y,
      vx: (fxR() - 0.5) * 260,
      vy: -70 - fxR() * 210,
      gravity: 360 + fxR() * 160,
      life: 0.35 + fxR() * 0.4,
      maxLife: 0.75,
      size: 2 + fxR() * 4,
      color: colors[Math.floor(fxR() * colors.length)],
      spin: (fxR() - 0.5) * 10,
      angle: fxR() * Math.PI,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.angle += p.spin * dt;
  }
}

function drawParticles() {
  fxCtx.clearRect(0, 0, W, H);
  for (const p of particles) {
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.angle);
    fxCtx.fillStyle = p.color;
    fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    fxCtx.restore();
  }
}

function floatText(text, x, y, normal = false) {
  const label = document.createElement('span');
  label.className = 'float-label' + (normal ? ' normal' : '');
  label.textContent = text;
  label.style.left = Math.max(8, Math.min(92, x / W * 100)) + '%';
  label.style.top = Math.max(18, Math.min(82, y / H * 100)) + '%';
  label.addEventListener('animationend', () => label.remove(), { once: true });
  floatLayer.appendChild(label);
}

function screenPoint(blockOrX, y) {
  const x = typeof blockOrX === 'number'
    ? blockOrX
    : blockOrX.x + blockOrX.w / 2;
  const worldY = typeof blockOrX === 'number'
    ? y
    : blockOrX.y + CONFIG.blockH / 2;
  return { x, y: worldY + (state ? state.cameraY : 0) };
}

function reset() {
  clearEffects();
  const first = {
    x: (W - CONFIG.startW) / 2,
    y: H - 60,
    w: CONFIG.startW,
    h: CONFIG.blockH,
    kind: snackKindForIndex(0),
  };
  state = {
    mode: 'playing',   // playing | over
    blocks: [first],
    current: {
      x: Math.random() * (W - CONFIG.startW),
      y: first.y - CONFIG.blockH - CONFIG.gap,
      w: CONFIG.startW,
      h: CONFIG.blockH,
      kind: snackKindForIndex(1),
      dir: Math.random() < 0.5 ? 1 : -1,
    },
    speed: CONFIG.startSpeed,
    score: 0,
    combo: 0,
    lastDropAt: 0,
    best: loadBest(),
    cameraY: 0,
  };
  updateHud();
}

// ===== 3. 输入 =====
wrap.addEventListener('pointerdown', () => {
  audio.ensure();
  // 整个屏幕都能落块，但开始/重开遮罩上的点击不能穿透到游戏。
  if (!state || state.mode !== 'playing' || !overlay.classList.contains('hidden')) return;
  const now = performance.now();
  if (now - state.lastDropAt < 120) return; // 防移动端双击一次消费两块
  state.lastDropAt = now;
  drop();
});

startBtn.addEventListener('click', () => {
  audio.ensure();
  overlay.classList.add('hidden');
  reset();
});

muteBtn.addEventListener('pointerdown', (event) => {
  event.stopPropagation();
  audio.ensure();
});

muteBtn.addEventListener('click', (event) => {
  event.stopPropagation();
  audio.ensure();
  audio.toggle();
});

// ===== 4. 核心逻辑 =====
function drop() {
  const cur = state.current;
  const top = state.blocks[state.blocks.length - 1];

  // 两块的重叠区间
  const left = Math.max(cur.x, top.x);
  const right = Math.min(cur.x + cur.w, top.x + top.w);
  const overlap = right - left;

  if (overlap < CONFIG.minOverlap) {
    return gameOver();
  }

  // 新块就是重叠部分，保留原版切割规则。
  const newBlock = {
    x: left,
    y: top.y - CONFIG.blockH,
    w: overlap,
    h: CONFIG.blockH,
    kind: snackKindForIndex(state.blocks.length),
  };
  state.blocks.push(newBlock);

  // perfect：两块中心点距离
  const curCenter = cur.x + cur.w / 2;
  const topCenter = top.x + top.w / 2;
  const perfect = Math.abs(curCenter - topCenter) <= CONFIG.perfect;

  if (perfect) {
    state.combo += 1;
    // 倍率 1 + combo×0.1，等价于整数分，避免浮点误差被 HUD 向下取整。
    state.score += Math.min(30, 10 + state.combo);
  } else {
    state.combo = 0;
    state.score += 5;
  }

  // 镜头跟随 + 加速
  state.cameraY = Math.max(0, (state.blocks.length - 8) * CONFIG.blockH);
  state.speed = Math.min(CONFIG.maxSpeed, state.speed + CONFIG.speedAdd);

  const effectPoint = screenPoint(newBlock);
  audio.drop();
  if (perfect) {
    audio.perfect();
    if (state.combo >= 2) audio.combo(state.combo);
    triggerFlash('perfect', CONFIG.perfectFlashMs);
    shakeScreen('light', CONFIG.shakeLightMs);
    addParticles(
      effectPoint.x,
      effectPoint.y,
      ['#fff6c7', '#ffd166', '#8ae9ff'],
      CONFIG.particlePerfect,
    );
    floatText('PERFECT +1', effectPoint.x, effectPoint.y - 8);
  } else {
    addParticles(
      effectPoint.x,
      effectPoint.y,
      ['#bff6ff', '#90e0ef', '#d8fbff'],
      CONFIG.particleNormal,
    );
    floatText('+5', effectPoint.x, effectPoint.y - 6, true);
  }

  // 下一块：宽度跟当前顶层一致
  state.current = {
    x: Math.random() * (W - newBlock.w),
    y: newBlock.y - CONFIG.blockH - CONFIG.gap,
    w: newBlock.w,
    h: CONFIG.blockH,
    kind: snackKindForIndex(state.blocks.length),
    dir: Math.random() < 0.5 ? 1 : -1,
  };

  updateHud();
}

function gameOver() {
  const effectPoint = screenPoint(state.current);
  state.mode = 'over';
  if (state.score > state.best) {
    state.best = state.score;
    saveBest(state.best);
  }
  audio.fail();
  triggerFlash('danger', CONFIG.failFlashMs);
  shakeScreen('heavy', CONFIG.shakeHeavyMs);
  addParticles(
    effectPoint.x,
    effectPoint.y,
    ['#ff425c', '#ff9b54', '#ffd166'],
    CONFIG.particleFail,
  );

  window.setTimeout(() => {
    overlay.classList.remove('hidden');
    overlay.innerHTML =
      '<h1>游戏结束</h1>' +
      '<p>分数 ' + Math.floor(state.score) + ' · 最高 ' + Math.floor(state.best) + '</p>' +
      '<button id="again">再来一局</button>';
    document.getElementById('again').onclick = () => {
      overlay.classList.add('hidden');
      reset();
    };
  }, CONFIG.failFlashMs);
  updateHud();
}

function updateHud() {
  if (!state) return;
  scoreTag.textContent = '分数 ' + Math.floor(state.score);
  comboTag.textContent = '连击 ' + state.combo;
  bestTag.textContent = '最高 ' + Math.floor(state.best);
}

const SNACK_KINDS = ['tanghulu', 'eggette', 'lemonTea'];
const STARS = Array.from({ length: 34 }, (_, i) => ({
  x: (i * 83 + 19) % W,
  y: 18 + ((i * 47 + i * i * 7) % 270),
  r: i % 4 === 0 ? 1.5 : 0.8,
  a: 0.25 + (i % 5) * 0.09,
}));

function snackKindForIndex(index) {
  return SNACK_KINDS[index % SNACK_KINDS.length];
}

function roundRectPath(c, x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + radius, y);
  c.lineTo(x + w - radius, y);
  c.quadraticCurveTo(x + w, y, x + w, y + radius);
  c.lineTo(x + w, y + h - radius);
  c.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  c.lineTo(x + radius, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - radius);
  c.lineTo(x, y + radius);
  c.quadraticCurveTo(x, y, x + radius, y);
  c.closePath();
}

function drawLantern(c, x, y, phase, time) {
  const swing = Math.sin(time / 900 + phase) * 0.075;
  c.save();
  c.translate(x, y);
  c.rotate(swing);

  const glow = c.createRadialGradient(0, 0, 3, 0, 0, 66);
  glow.addColorStop(0, 'rgba(255, 199, 98, .28)');
  glow.addColorStop(1, 'rgba(255, 143, 72, 0)');
  c.fillStyle = glow;
  c.fillRect(-68, -68, 136, 136);

  c.strokeStyle = 'rgba(255, 231, 180, .72)';
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(0, -58);
  c.lineTo(0, -20);
  c.stroke();

  c.fillStyle = '#f0b43c';
  c.fillRect(-12, -21, 24, 4);
  c.fillRect(-11, 17, 22, 4);

  const body = c.createLinearGradient(-18, 0, 18, 0);
  body.addColorStop(0, '#8f1f32');
  body.addColorStop(0.45, '#ff5b49');
  body.addColorStop(1, '#991f3a');
  c.fillStyle = body;
  c.strokeStyle = '#ffd078';
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(-18, -18);
  c.quadraticCurveTo(-25, 0, -18, 18);
  c.quadraticCurveTo(0, 25, 18, 18);
  c.quadraticCurveTo(25, 0, 18, -18);
  c.quadraticCurveTo(0, -25, -18, -18);
  c.closePath();
  c.fill();
  c.stroke();

  c.strokeStyle = 'rgba(255, 220, 139, .45)';
  c.lineWidth = 1;
  for (let offset = -11; offset <= 11; offset += 11) {
    c.beginPath();
    c.moveTo(offset, -18);
    c.quadraticCurveTo(offset * 1.25, 0, offset, 18);
    c.stroke();
  }

  c.fillStyle = '#ffe8a6';
  c.font = '700 15px "Microsoft YaHei", sans-serif';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(phase > 0 ? '市' : '夜', 0, 1);

  c.strokeStyle = '#e8a63a';
  c.beginPath();
  c.moveTo(0, 22);
  c.lineTo(0, 31);
  c.moveTo(-4, 31);
  c.lineTo(0, 40);
  c.lineTo(4, 31);
  c.stroke();
  c.restore();
}

function drawNightMarket(time) {
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#07132d');
  bg.addColorStop(0.52, '#21133d');
  bg.addColorStop(1, '#3a1639');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  for (const star of STARS) {
    ctx.globalAlpha = star.a * (0.78 + 0.22 * Math.sin(time / 700 + star.x));
    ctx.fillStyle = '#e8f7ff';
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const moonGlow = ctx.createRadialGradient(292, 106, 8, 292, 106, 70);
  moonGlow.addColorStop(0, 'rgba(255, 242, 178, .32)');
  moonGlow.addColorStop(1, 'rgba(255, 242, 178, 0)');
  ctx.fillStyle = moonGlow;
  ctx.fillRect(210, 24, 164, 164);
  ctx.fillStyle = '#ffe89b';
  ctx.beginPath();
  ctx.arc(292, 106, 29, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = 'rgba(7, 11, 31, .82)';
  const buildings = [
    [0, 300, 66, 210],
    [52, 268, 48, 240],
    [102, 322, 74, 188],
    [260, 286, 58, 224],
    [307, 326, 53, 184],
  ];
  for (const [x, y, w, h] of buildings) {
    ctx.fillRect(x, y, w, h);
  }

  ctx.strokeStyle = 'rgba(99, 222, 255, .18)';
  ctx.lineWidth = 2;
  ctx.strokeRect(16, 373, 65, 118);
  ctx.strokeRect(279, 353, 65, 138);

  ctx.fillStyle = 'rgba(92, 224, 255, .62)';
  ctx.font = '700 17px "Microsoft YaHei", sans-serif';
  ctx.save();
  ctx.translate(36, 430);
  ctx.rotate(-Math.PI / 2);
  ctx.fillText('夜 市', 0, 0);
  ctx.restore();

  ctx.fillStyle = 'rgba(255, 153, 92, .56)';
  ctx.font = '700 15px "Microsoft YaHei", sans-serif';
  ctx.save();
  ctx.translate(326, 435);
  ctx.rotate(Math.PI / 2);
  ctx.fillText('小 吃', 0, 0);
  ctx.restore();

  ctx.fillStyle = 'rgba(10, 12, 29, .92)';
  ctx.fillRect(0, 604, W, 36);
  const floorGlow = ctx.createLinearGradient(0, 600, 0, 626);
  floorGlow.addColorStop(0, 'rgba(255, 112, 94, .38)');
  floorGlow.addColorStop(1, 'rgba(255, 112, 94, 0)');
  ctx.fillStyle = floorGlow;
  ctx.fillRect(0, 600, W, 26);

  drawLantern(ctx, 31, 170, 0, time);
  drawLantern(ctx, 329, 204, Math.PI, time);

  const fog = ctx.createLinearGradient(0, 500, 0, 640);
  fog.addColorStop(0, 'rgba(66, 84, 128, 0)');
  fog.addColorStop(1, 'rgba(89, 112, 151, .12)');
  ctx.fillStyle = fog;
  ctx.fillRect(0, 500, W, 140);
}

function drawTanghulu(c, block, moving) {
  const cy = block.y + block.h / 2;
  const left = block.x + 4;
  const right = block.x + block.w - 4;
  const count = Math.max(2, Math.min(6, Math.floor(block.w / 22)));
  const gap = (right - left) / count;
  const radius = Math.max(4, Math.min(8, gap * 0.34, block.h * 0.29));

  c.save();
  c.shadowColor = moving ? 'rgba(255, 185, 104, .72)' : 'rgba(0, 0, 0, .42)';
  c.shadowBlur = moving ? 12 : 4;
  c.strokeStyle = '#d8a458';
  c.lineWidth = Math.max(1.5, Math.min(2.4, block.w / 55));
  c.beginPath();
  c.moveTo(left, cy + 5);
  c.lineTo(right, cy + 5);
  c.stroke();
  c.shadowBlur = 0;

  for (let i = 0; i < count; i++) {
    const x = left + gap * (i + 0.5);
    const berry = c.createRadialGradient(
      x - radius * 0.32,
      cy - radius * 0.38,
      radius * 0.12,
      x,
      cy,
      radius,
    );
    berry.addColorStop(0, '#ff9c79');
    berry.addColorStop(0.45, '#f04445');
    berry.addColorStop(1, '#a41431');
    c.fillStyle = berry;
    c.strokeStyle = moving ? '#ffe69e' : '#6e1826';
    c.lineWidth = moving ? 1.8 : 1;
    c.beginPath();
    c.arc(x, cy - 1, radius, 0, Math.PI * 2);
    c.fill();
    c.stroke();
    c.strokeStyle = 'rgba(255, 238, 193, .88)';
    c.lineWidth = 1.2;
    c.beginPath();
    c.arc(x, cy - 1, radius * 0.72, Math.PI * 1.08, Math.PI * 1.48);
    c.stroke();
  }
  c.restore();
}

function drawEggette(c, block, moving) {
  const x = block.x + 3;
  const y = block.y + 3;
  const w = Math.max(5, block.w - 6);
  const h = Math.max(9, block.h - 6);
  const fill = c.createLinearGradient(x, y, x, y + h);
  fill.addColorStop(0, '#ffd66f');
  fill.addColorStop(1, '#dc8d24');

  c.save();
  c.shadowColor = moving ? 'rgba(255, 215, 105, .74)' : 'rgba(0, 0, 0, .45)';
  c.shadowBlur = moving ? 12 : 4;
  roundRectPath(c, x, y, w, h, Math.min(7, h / 3));
  c.fillStyle = fill;
  c.fill();
  c.strokeStyle = moving ? '#fff0a5' : '#98551d';
  c.lineWidth = moving ? 2 : 1.3;
  c.stroke();
  c.shadowBlur = 0;

  c.save();
  roundRectPath(c, x + 1, y + 1, w - 2, h - 2, Math.min(6, h / 3));
  c.clip();
  c.strokeStyle = 'rgba(138, 75, 21, .52)';
  c.lineWidth = 1;
  const stepX = Math.max(7, Math.min(16, w / 5));
  const stepY = Math.max(5, h / 3);
  for (let gx = x + stepX; gx < x + w; gx += stepX) {
    c.beginPath();
    c.moveTo(gx, y);
    c.lineTo(gx, y + h);
    c.stroke();
  }
  for (let gy = y + stepY; gy < y + h; gy += stepY) {
    c.beginPath();
    c.moveTo(x, gy);
    c.lineTo(x + w, gy);
    c.stroke();
  }
  c.restore();
  c.restore();
}

function drawLemonTea(c, block, moving) {
  const cx = block.x + block.w / 2;
  const cy = block.y + block.h / 2;
  const cupW = Math.max(10, Math.min(38, block.w - 8));
  const cupH = 22;
  const topY = cy - cupH / 2;
  const bottomY = cy + cupH / 2;

  c.save();
  c.shadowColor = moving ? 'rgba(99, 229, 255, .72)' : 'rgba(0, 0, 0, .4)';
  c.shadowBlur = moving ? 12 : 4;
  c.strokeStyle = moving ? '#a8f5ff' : 'rgba(170, 225, 223, .65)';
  c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(block.x + 5, bottomY + 2);
  c.lineTo(block.x + block.w - 5, bottomY + 2);
  c.stroke();
  c.shadowBlur = 0;

  c.fillStyle = 'rgba(218, 250, 255, .3)';
  c.strokeStyle = moving ? '#bdf8ff' : '#8bcbd0';
  c.lineWidth = moving ? 2 : 1.3;
  c.beginPath();
  c.moveTo(cx - cupW * 0.42, topY);
  c.lineTo(cx + cupW * 0.42, topY);
  c.lineTo(cx + cupW * 0.31, bottomY);
  c.lineTo(cx - cupW * 0.31, bottomY);
  c.closePath();
  c.fill();
  c.stroke();

  c.save();
  c.beginPath();
  c.moveTo(cx - cupW * 0.36, topY + 7);
  c.lineTo(cx + cupW * 0.36, topY + 7);
  c.lineTo(cx + cupW * 0.29, bottomY - 1);
  c.lineTo(cx - cupW * 0.29, bottomY - 1);
  c.closePath();
  c.clip();
  c.fillStyle = 'rgba(255, 206, 76, .48)';
  c.fillRect(cx - cupW / 2, cy - 2, cupW, cupH);
  c.fillStyle = 'rgba(255, 241, 154, .55)';
  c.beginPath();
  c.arc(cx + cupW * 0.15, cy - 2, Math.max(3, cupW * 0.13), 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = 'rgba(255, 255, 223, .8)';
  c.stroke();
  c.restore();

  c.strokeStyle = '#ff9f7b';
  c.lineWidth = Math.max(2, Math.min(3.5, cupW / 14));
  c.beginPath();
  c.moveTo(cx + cupW * 0.12, topY + 1);
  c.lineTo(cx + cupW * 0.25, topY - 3);
  c.stroke();
  c.restore();
}

function drawSnack(c, block, moving) {
  if (block.kind === 'tanghulu') drawTanghulu(c, block, moving);
  else if (block.kind === 'lemonTea') drawLemonTea(c, block, moving);
  else drawEggette(c, block, moving);
}

// ===== 5. 主循环 =====
let last = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;

  if (state && state.mode === 'playing') {
    const cur = state.current;
    cur.x += cur.dir * state.speed * dt;
    if (cur.x < 0) { cur.x = 0; cur.dir = 1; }
    if (cur.x + cur.w > W) { cur.x = W - cur.w; cur.dir = -1; }
  }

  draw(t);
  updateParticles(dt);
  drawParticles();
  requestAnimationFrame(loop);
}

function draw(time) {
  ctx.clearRect(0, 0, W, H);
  drawNightMarket(time);
  if (!state) return;

  ctx.save();
  ctx.translate(0, state.cameraY);   // 镜头跟随牌堆向上

  // 已叠好的块
  for (const b of state.blocks) {
    drawSnack(ctx, b, false);
  }

  // 当前块
  if (state.mode === 'playing') {
    drawSnack(ctx, state.current, true);
  }

  ctx.restore();
}

// ===== 6. 自适应缩放（保持 9:16，不变形） =====
function fitCanvas() {
  const wrapStyle = getComputedStyle(wrap);
  const safeWidth =
    wrap.clientWidth -
    parseFloat(wrapStyle.paddingLeft) -
    parseFloat(wrapStyle.paddingRight);
  const safeHeight =
    wrap.clientHeight -
    parseFloat(wrapStyle.paddingTop) -
    parseFloat(wrapStyle.paddingBottom);
  const scale = Math.max(0.1, Math.min(safeWidth / W, safeHeight / H));
  stage.style.width = (W * scale) + 'px';
  stage.style.height = (H * scale) + 'px';
  pixelRatio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const pixelWidth = Math.round(W * pixelRatio);
  const pixelHeight = Math.round(H * pixelRatio);
  for (const surface of [canvas, fxCanvas]) {
    if (surface.width !== pixelWidth || surface.height !== pixelHeight) {
      surface.width = pixelWidth;
      surface.height = pixelHeight;
    }
  }
  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  fxCtx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ===== 7. 启动 =====
reset();
requestAnimationFrame(loop);
</script>
