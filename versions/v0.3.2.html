<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>夜市叠叠高 v0.3.2</title>
<style>
  html, body { position: fixed; inset: 0; margin: 0; height: 100%; background: #060812;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: relative; box-sizing: border-box; width: 100vw; height: 100vh;
    height: 100dvh; padding: max(6px, env(safe-area-inset-top))
      max(6px, env(safe-area-inset-right)) max(6px, env(safe-area-inset-bottom))
      max(6px, env(safe-area-inset-left));
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 50% 64%, rgba(255, 126, 74, .13), transparent 46%),
      radial-gradient(circle at 50% 38%, #1a2247 0%, #060812 72%);
    touch-action: none; }
  #stage { position: relative; width: 360px; height: 640px; flex: none;
    overflow: hidden; border-radius: 14px; box-shadow: 0 0 0 1px rgba(112, 230, 255, .1),
      0 20px 60px rgba(0, 0, 0, .45), 0 0 34px rgba(88, 85, 210, .14);
    background: #081329; transform: translate3d(0, 0, 0); will-change: transform;
    touch-action: none; }
  #stage canvas { position: absolute; inset: 0; display: block;
    width: 100%; height: 100%; background: transparent; touch-action: none; }
  #game { z-index: 1; }
  #stage #fx { z-index: 2; pointer-events: none; background: transparent; }
  #hud, #mute { transition: opacity 180ms ease; }
  #wrap:not(.playing) #hud,
  #wrap:not(.playing) #mute { opacity: 0; pointer-events: none; }
  #hud { position: absolute; z-index: 3;
    top: max(10px, env(safe-area-inset-top)); left: 52px; right: 52px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
    color: #f1e3ca; font-size: 12px; pointer-events: none;
    white-space: nowrap; }
  #hud > span { padding: 3px 9px; border-radius: 999px;
    background: rgba(11, 8, 22, .48);
    border: 1px solid rgba(255, 200, 132, .14);
    backdrop-filter: blur(6px); }
  #comboTag { color: #ffd06a; font-weight: 900; font-size: 16px;
    letter-spacing: .04em;
    border-color: rgba(255, 190, 100, .34);
    text-shadow: 0 0 12px rgba(255, 190, 100, .6), 0 1px 4px rgba(0, 0, 0, .8); }
  #flash { position: absolute; z-index: 4; inset: 0; opacity: 0;
    pointer-events: none; background: #fff; }
  #flash.danger { background: #ff3d55; }
  #flash.active { animation: flash 80ms ease-out; }
  #flash.danger.active { animation-duration: 140ms; }
  #floats { position: absolute; z-index: 5; inset: 0; overflow: hidden;
    pointer-events: none; }
  .float-label { position: absolute; transform: translate(-50%, -50%);
    font-weight: 900; font-size: 20px; line-height: 1;
    color: #fffbdc; text-shadow: 0 2px 0 #4a2a00, 0 0 12px #ffd166;
    white-space: nowrap; animation: float-up 700ms ease-out forwards; }
  .float-label.normal { font-size: 16px; color: #bff6ff;
    text-shadow: 0 2px 0 #06445a, 0 0 10px #90e0ef; }
  #mute { position: absolute; z-index: 20;
    top: max(10px, env(safe-area-inset-top));
    right: max(10px, env(safe-area-inset-right));
    width: 44px; height: 44px; margin: 0; padding: 0; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .28);
    background: rgba(25, 12, 31, .78); color: #fff; font-size: 20px;
    line-height: 1; box-shadow: 0 4px 14px rgba(0, 0, 0, .32);
    cursor: pointer; backdrop-filter: blur(8px); }
  #mute[aria-pressed="true"] { color: #ff9baa; }
  #overlay { position: absolute; inset: 0; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 28px; overflow: hidden;
    background:
      radial-gradient(circle at 50% 78%, rgba(255, 118, 72, .20), transparent 46%),
      radial-gradient(circle at 50% 34%, rgba(52, 30, 82, .26), transparent 62%),
      linear-gradient(180deg, rgba(4, 7, 20, .54), rgba(9, 5, 17, .68));
    color: #fff; text-align: center; z-index: 10; }
  #overlay::before { content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(circle at 16% 15%, rgba(255, 96, 82, .20), transparent 25%),
      radial-gradient(circle at 85% 20%, rgba(86, 220, 255, .10), transparent 27%),
      repeating-linear-gradient(0deg, rgba(255, 240, 210, .02) 0 1px, transparent 1px 4px); }
  #overlay > * { position: relative; }
  #overlay .kicker { margin: 0 0 10px; font-size: 11px; letter-spacing: .44em;
    color: rgba(255, 206, 138, .78); text-indent: .44em; }
  #overlay h1 { margin: 0; font-size: clamp(30px, 8.6vw, 44px); letter-spacing: .1em;
    color: #ffe7a6;
    text-shadow: 0 0 26px rgba(255, 176, 84, .5), 0 3px 0 #6b2418,
      0 8px 20px rgba(0, 0, 0, .65); }
  #overlay .rule { width: 76px; height: 1px; margin: 20px 0 0;
    background: linear-gradient(90deg, transparent,
      rgba(255, 196, 124, .8), transparent); }
  #overlay p { margin: 18px 0 2px; color: #f0e6d6; font-size: 15px; line-height: 1.9;
    letter-spacing: .02em; }
  #overlay.hidden { display: none; }
  button { margin-top: 22px; padding: 13px 36px; font-size: 17px; border: 0;
    border-radius: 999px; letter-spacing: .08em;
    background: linear-gradient(160deg, #ffeaa9 0%, #ffc464 48%, #ff994d 100%);
    color: #3c1a10; font-weight: 800;
    box-shadow: 0 10px 26px rgba(255, 150, 60, .32),
      inset 0 1px 0 rgba(255, 255, 255, .7);
    cursor: pointer; touch-action: manipulation;
    transition: transform 90ms ease; }
  button:active { transform: translateY(1px) scale(.985); }
  #stage.shake-light { animation: shake-light 120ms ease-out; }
  #stage.shake-heavy { animation: shake-heavy 220ms ease-out; }
  @keyframes flash {
    0% { opacity: .78; }
    100% { opacity: 0; }
  }
  @keyframes float-up {
    0% { opacity: 0; transform: translate(-50%, -30%) scale(.72); }
    18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    100% { opacity: 0; transform: translate(-50%, -170%) scale(.96); }
  }
  @keyframes shake-light {
    0%, 100% { transform: translate3d(0, 0, 0); }
    25% { transform: translate3d(-2px, 1px, 0); }
    50% { transform: translate3d(2px, -1px, 0); }
    75% { transform: translate3d(-1px, 0, 0); }
  }
  @keyframes shake-heavy {
    0%, 100% { transform: translate3d(0, 0, 0); }
    15% { transform: translate3d(-7px, 3px, 0); }
    30% { transform: translate3d(7px, -3px, 0); }
    45% { transform: translate3d(-5px, -2px, 0); }
    60% { transform: translate3d(5px, 2px, 0); }
    75% { transform: translate3d(-2px, 1px, 0); }
  }
  @media (prefers-reduced-motion: reduce) {
    #stage.shake-light, #stage.shake-heavy { animation: none; }
    #flash.active { animation: none; opacity: 0; }
    .float-label { animation-duration: 360ms; }
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="360" height="640"></canvas>
    <canvas id="fx" width="360" height="640"></canvas>
    <div id="hud">
      <span id="scoreTag">分数 0</span>
      <span id="comboTag">连击 0</span>
      <span id="bestTag">最高 0</span>
    </div>
    <div id="flash"></div>
    <div id="floats" aria-live="polite"></div>
  </div>
  <button id="mute" type="button" aria-label="关闭声音" aria-pressed="false">🔊</button>
  <div id="overlay">
    <p class="kicker">NIGHT MARKET</p>
    <h1>夜市叠叠高</h1>
    <div class="rule"></div>
    <p>点击屏幕，让小吃落下<br>叠得越高，分越高</p>
    <button id="start">开始</button>
  </div>
</div>
<script>
// ===== 1. 配置：想调手感，先改这里 =====
const W = 360, H = 640;
const CONFIG = {
  blockH: 28,        // 每块高度
  startW: 160,       // 第一块宽度
  startSpeed: 100,   // 初始左右移动速度（像素/秒）
  speedAdd: 3,       // 每叠一块加速
  maxSpeed: 300,     // 速度上限
  perfect: 12,       // 中心偏差 <= 12px 算 perfect
  minOverlap: 10,    // 重叠 < 10px 直接失败
  gap: 80,           // 当前块与牌堆的间距
  perfectFlashMs: 80,
  failFlashMs: 140,
  shakeLightMs: 120,
  shakeHeavyMs: 220,
  particleMax: 20,
  particlePerfect: 12,
  particleNormal: 5,
  particleFail: 20,
  audioVolume: 0.2,
};

// ===== 2. 状态 =====
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const scoreTag = document.getElementById('scoreTag');
const comboTag = document.getElementById('comboTag');
const bestTag = document.getElementById('bestTag');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start');
const wrap = document.getElementById('wrap');
const stage = document.getElementById('stage');
const fxCanvas = document.getElementById('fx');
const fxCtx = fxCanvas.getContext('2d');
const flash = document.getElementById('flash');
const floatLayer = document.getElementById('floats');
const muteBtn = document.getElementById('mute');

let state = null;
let particles = [];
let flashTimer = 0;
let shakeTimer = 0;
let pixelRatio = 1;

// 视觉和音频使用独立随机流，绝不消耗玩法的 Math.random()。
let fxSeed = (Date.now() ^ 0x9e3779b9) >>> 0;
function fxR() {
  fxSeed ^= fxSeed << 13;
  fxSeed ^= fxSeed >>> 17;
  fxSeed ^= fxSeed << 5;
  return (fxSeed >>> 0) / 4294967296;
}

function loadBest() {
  try { return Number(localStorage.getItem('best') || 0); } catch (e) { return 0; }
}
function saveBest(v) {
  try { localStorage.setItem('best', String(v)); } catch (e) {}
}

function loadMuted() {
  try { return localStorage.getItem('muted') === '1'; } catch (e) { return false; }
}

function saveMuted(v) {
  try { localStorage.setItem('muted', v ? '1' : '0'); } catch (e) {}
}

class AudioEngine {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.compressor = null;
    this.noiseBuffer = null;
    this.muted = loadMuted();
    this.renderButton();
  }

  ensure() {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!this.ctx && AudioCtor) {
      this.ctx = new AudioCtor();
      this.master = this.ctx.createGain();
      this.compressor = this.ctx.createDynamicsCompressor();
      this.compressor.threshold.value = -16;
      this.compressor.knee.value = 12;
      this.compressor.ratio.value = 3;
      this.compressor.attack.value = 0.003;
      this.compressor.release.value = 0.18;
      this.master.connect(this.compressor);
      this.compressor.connect(this.ctx.destination);
      this.applyVolume(0);
    }
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    this.applyVolume(0.01);
  }

  applyVolume(seconds) {
    if (!this.ctx || !this.master) return;
    const target = this.muted ? 0 : CONFIG.audioVolume;
    const now = this.ctx.currentTime;
    if (seconds > 0) {
      this.master.gain.setTargetAtTime(target, now, seconds);
    } else {
      this.master.gain.setValueAtTime(target, now);
    }
  }

  toggle() {
    this.muted = !this.muted;
    saveMuted(this.muted);
    this.applyVolume(0.01);
    this.renderButton();
  }

  renderButton() {
    muteBtn.textContent = this.muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-pressed', String(this.muted));
    muteBtn.setAttribute('aria-label', this.muted ? '打开声音' : '关闭声音');
  }

  tone(freq, type, duration, volume, delay = 0, endFreq = freq) {
    if (!this.ctx || this.muted) return;
    const start = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(20, freq), start);
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), start + duration);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, volume), start + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    osc.connect(gain);
    gain.connect(this.master);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  }

  noise(duration, volume, cutoff, delay = 0) {
    if (!this.ctx || this.muted) return;
    if (!this.noiseBuffer) {
      const length = Math.max(1, Math.floor(this.ctx.sampleRate * 0.5));
      this.noiseBuffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
      const data = this.noiseBuffer.getChannelData(0);
      for (let i = 0; i < length; i++) data[i] = fxR() * 2 - 1;
    }
    const start = this.ctx.currentTime + delay;
    const source = this.ctx.createBufferSource();
    const filter = this.ctx.createBiquadFilter();
    const gain = this.ctx.createGain();
    source.buffer = this.noiseBuffer;
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(cutoff, start);
    gain.gain.setValueAtTime(Math.max(0.0001, volume), start);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
    source.connect(filter);
    filter.connect(gain);
    gain.connect(this.master);
    source.start(start);
    source.stop(start + duration + 0.02);
  }

  drop() {
    this.tone(170, 'triangle', 0.07, 0.11, 0, 105);
    this.noise(0.045, 0.035, 1100);
  }

  perfect() {
    this.tone(660, 'sine', 0.18, 0.1);
    this.tone(880, 'sine', 0.2, 0.08, 0.035);
    this.tone(1100, 'triangle', 0.22, 0.055, 0.07);
  }

  combo(level) {
    const freq = 520 + Math.min(level, 10) * 38;
    this.tone(freq, 'triangle', 0.16, 0.07, 0.08, freq * 1.18);
  }

  fail() {
    this.tone(220, 'sawtooth', 0.34, 0.1, 0, 55);
    this.noise(0.16, 0.07, 550);
  }
}

const audio = new AudioEngine();

function clearEffects() {
  particles = [];
  fxCtx.clearRect(0, 0, W, H);
  flash.classList.remove('active', 'danger');
  clearTimeout(flashTimer);
  clearTimeout(shakeTimer);
  stage.classList.remove('shake-light', 'shake-heavy');
}

function triggerFlash(kind, duration) {
  clearTimeout(flashTimer);
  flash.classList.remove('active', 'danger');
  void flash.offsetWidth;
  if (kind === 'danger') flash.classList.add('danger');
  flash.classList.add('active');
  flashTimer = window.setTimeout(() => {
    flash.classList.remove('active', 'danger');
  }, duration);
}

function shakeScreen(kind, duration) {
  clearTimeout(shakeTimer);
  stage.classList.remove('shake-light', 'shake-heavy');
  void stage.offsetWidth;
  stage.classList.add(kind === 'heavy' ? 'shake-heavy' : 'shake-light');
  shakeTimer = window.setTimeout(() => {
    stage.classList.remove('shake-light', 'shake-heavy');
  }, duration);
}

function addParticles(x, y, colors, count) {
  for (let i = 0; i < count && particles.length < CONFIG.particleMax; i++) {
    particles.push({
      x,
      y,
      vx: (fxR() - 0.5) * 260,
      vy: -70 - fxR() * 210,
      gravity: 360 + fxR() * 160,
      life: 0.35 + fxR() * 0.4,
      maxLife: 0.75,
      size: 2 + fxR() * 4,
      color: colors[Math.floor(fxR() * colors.length)],
      spin: (fxR() - 0.5) * 10,
      angle: fxR() * Math.PI,
    });
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += p.gravity * dt;
    p.angle += p.spin * dt;
  }
}

function drawParticles() {
  fxCtx.clearRect(0, 0, W, H);
  for (const p of particles) {
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life / p.maxLife));
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.angle);
    fxCtx.fillStyle = p.color;
    fxCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    fxCtx.restore();
  }
}

function floatText(text, x, y, normal = false) {
  const label = document.createElement('span');
  label.className = 'float-label' + (normal ? ' normal' : '');
  label.textContent = text;
  label.style.left = Math.max(8, Math.min(92, x / W * 100)) + '%';
  label.style.top = Math.max(18, Math.min(82, y / H * 100)) + '%';
  label.addEventListener('animationend', () => label.remove(), { once: true });
  floatLayer.appendChild(label);
}

function screenPoint(blockOrX, y) {
  const x = typeof blockOrX === 'number'
    ? blockOrX
    : blockOrX.x + blockOrX.w / 2;
  const worldY = typeof blockOrX === 'number'
    ? y
    : blockOrX.y + CONFIG.blockH / 2;
  return { x, y: worldY + (state ? state.cameraY : 0) };
}

function reset() {
  clearEffects();
  const first = {
    x: (W - CONFIG.startW) / 2,
    y: H - 60,
    w: CONFIG.startW,
    h: CONFIG.blockH,
    kind: snackKindForIndex(0),
  };
  state = {
    mode: 'playing',   // playing | over
    blocks: [first],
    current: {
      x: Math.random() * (W - CONFIG.startW),
      y: first.y - CONFIG.blockH - CONFIG.gap,
      w: CONFIG.startW,
      h: CONFIG.blockH,
      kind: snackKindForIndex(1),
      dir: Math.random() < 0.5 ? 1 : -1,
    },
    speed: CONFIG.startSpeed,
    score: 0,
    combo: 0,
    lastDropAt: 0,
    best: loadBest(),
    cameraY: 0,
  };
  updateHud();
}

// ===== 3. 输入 =====
wrap.addEventListener('pointerdown', () => {
  audio.ensure();
  // 整个屏幕都能落块，但开始/重开遮罩上的点击不能穿透到游戏。
  if (!state || state.mode !== 'playing' || !overlay.classList.contains('hidden')) return;
  const now = performance.now();
  if (now - state.lastDropAt < 120) return; // 防移动端双击一次消费两块
  state.lastDropAt = now;
  drop();
});

startBtn.addEventListener('click', () => {
  audio.ensure();
  overlay.classList.add('hidden');
  wrap.classList.add('playing');
  reset();
});

muteBtn.addEventListener('pointerdown', (event) => {
  event.stopPropagation();
  audio.ensure();
});

muteBtn.addEventListener('click', (event) => {
  event.stopPropagation();
  audio.ensure();
  audio.toggle();
});

// ===== 4. 核心逻辑 =====
function drop() {
  const cur = state.current;
  const top = state.blocks[state.blocks.length - 1];

  // 两块的重叠区间
  const left = Math.max(cur.x, top.x);
  const right = Math.min(cur.x + cur.w, top.x + top.w);
  const overlap = right - left;

  if (overlap < CONFIG.minOverlap) {
    return gameOver();
  }

  // 新块就是重叠部分，保留原版切割规则。
  const newBlock = {
    x: left,
    y: top.y - CONFIG.blockH,
    w: overlap,
    h: CONFIG.blockH,
    kind: snackKindForIndex(state.blocks.length),
  };
  state.blocks.push(newBlock);

  // perfect：两块中心点距离
  const curCenter = cur.x + cur.w / 2;
  const topCenter = top.x + top.w / 2;
  const perfect = Math.abs(curCenter - topCenter) <= CONFIG.perfect;

  if (perfect) {
    state.combo += 1;
    // 倍率 1 + combo×0.1，等价于整数分，避免浮点误差被 HUD 向下取整。
    state.score += Math.min(30, 10 + state.combo);
  } else {
    state.combo = 0;
    state.score += 5;
  }

  // 镜头跟随 + 加速
  state.cameraY = Math.max(0, (state.blocks.length - 8) * CONFIG.blockH);
  state.speed = Math.min(CONFIG.maxSpeed, state.speed + CONFIG.speedAdd);

  const effectPoint = screenPoint(newBlock);
  audio.drop();
  if (perfect) {
    audio.perfect();
    if (state.combo >= 2) audio.combo(state.combo);
    triggerFlash('perfect', CONFIG.perfectFlashMs);
    shakeScreen('light', CONFIG.shakeLightMs);
    addParticles(
      effectPoint.x,
      effectPoint.y,
      ['#fff6c7', '#ffd166', '#8ae9ff'],
      CONFIG.particlePerfect,
    );
    floatText('PERFECT +1', effectPoint.x, effectPoint.y - 8);
  } else {
    addParticles(
      effectPoint.x,
      effectPoint.y,
      ['#bff6ff', '#90e0ef', '#d8fbff'],
      CONFIG.particleNormal,
    );
    floatText('+5', effectPoint.x, effectPoint.y - 6, true);
  }

  // 下一块：宽度跟当前顶层一致
  state.current = {
    x: Math.random() * (W - newBlock.w),
    y: newBlock.y - CONFIG.blockH - CONFIG.gap,
    w: newBlock.w,
    h: CONFIG.blockH,
    kind: snackKindForIndex(state.blocks.length),
    dir: Math.random() < 0.5 ? 1 : -1,
  };

  updateHud();
}

function gameOver() {
  const effectPoint = screenPoint(state.current);
  state.mode = 'over';
  if (state.score > state.best) {
    state.best = state.score;
    saveBest(state.best);
  }
  audio.fail();
  triggerFlash('danger', CONFIG.failFlashMs);
  shakeScreen('heavy', CONFIG.shakeHeavyMs);
  addParticles(
    effectPoint.x,
    effectPoint.y,
    ['#ff425c', '#ff9b54', '#ffd166'],
    CONFIG.particleFail,
  );

  window.setTimeout(() => {
    overlay.classList.remove('hidden');
    wrap.classList.remove('playing');
    overlay.innerHTML =
      '<p class="kicker">GAME OVER</p>' +
      '<h1>本摊打烊</h1>' +
      '<div class="rule"></div>' +
      '<p>分数 ' + Math.floor(state.score) + ' · 最高 ' + Math.floor(state.best) + '</p>' +
      '<button id="again">再来一局</button>';
    document.getElementById('again').onclick = () => {
      overlay.classList.add('hidden');
      wrap.classList.add('playing');
      reset();
    };
  }, CONFIG.failFlashMs);
  updateHud();
}

function updateHud() {
  if (!state) return;
  scoreTag.textContent = '分数 ' + Math.floor(state.score);
  comboTag.textContent = '连击 ' + state.combo;
  bestTag.textContent = '最高 ' + Math.floor(state.best);
}

const SNACK_KINDS = ['tanghulu', 'eggette', 'lemonTea'];
const STARS = Array.from({ length: 46 }, (_, i) => ({
  x: (i * 79 + 13) % W,
  y: 10 + ((i * 53 + i * i * 11) % 268),
  r: i % 7 === 0 ? 1.6 : 0.7 + (i % 3) * 0.22,
  a: 0.16 + (i % 6) * 0.07,
  ph: (i % 13) * 0.48,
}));

// 稳定伪随机：同一个方块每帧必须得到同样的细节，否则会闪。
function hash01(n) {
  const v = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return v - Math.floor(v);
}

const FLIES = Array.from({ length: 14 }, (_, i) => ({
  x: 18 + ((i * 71) % 324),
  y: 356 + ((i * 53) % 218),
  ph: i * 0.9,
  r: 0.8 + (i % 3) * 0.35,
}));

function drawFireflies(c, time) {
  for (const f of FLIES) {
    const x = f.x + Math.sin(time / 2600 + f.ph) * 12;
    const y = f.y + Math.cos(time / 3100 + f.ph * 1.3) * 8;
    const a = 0.22 + 0.34 * (0.5 + 0.5 * Math.sin(time / 900 + f.ph));
    c.fillStyle = 'rgba(255, 196, 110, ' + (a * 0.16).toFixed(3) + ')';
    c.beginPath();
    c.arc(x, y, f.r * 5, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = 'rgba(255, 228, 162, ' + a.toFixed(3) + ')';
    c.beginPath();
    c.arc(x, y, f.r, 0, Math.PI * 2);
    c.fill();
  }
}

function snackKindForIndex(index) {
  return SNACK_KINDS[index % SNACK_KINDS.length];
}

function roundRectPath(c, x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + radius, y);
  c.lineTo(x + w - radius, y);
  c.quadraticCurveTo(x + w, y, x + w, y + radius);
  c.lineTo(x + w, y + h - radius);
  c.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
  c.lineTo(x + radius, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - radius);
  c.lineTo(x, y + radius);
  c.quadraticCurveTo(x, y, x + radius, y);
  c.closePath();
}

function drawLantern(c, x, y, phase, time, scale = 1) {
  const swing = Math.sin(time / 1100 + phase) * 0.06;
  c.save();
  c.translate(x, y);
  c.rotate(swing);
  c.scale(scale, scale);

  const glow = c.createRadialGradient(0, 0, 4, 0, 0, 78);
  glow.addColorStop(0, 'rgba(255, 186, 108, .30)');
  glow.addColorStop(0.42, 'rgba(255, 128, 78, .12)');
  glow.addColorStop(1, 'rgba(255, 110, 70, 0)');
  c.fillStyle = glow;
  c.beginPath();
  c.arc(0, 0, 78, 0, Math.PI * 2);
  c.fill();

  // 吊绳
  c.strokeStyle = 'rgba(255, 226, 176, .5)';
  c.lineWidth = 1.1;
  c.beginPath();
  c.moveTo(0, -64);
  c.lineTo(0, -27);
  c.stroke();

  // 上下木盖
  c.fillStyle = '#c98b3c';
  roundRectPath(c, -7.5, -28, 15, 4.5, 1.6);
  c.fill();
  roundRectPath(c, -7.5, 23, 15, 4.5, 1.6);
  c.fill();

  // 灯身
  const body = c.createLinearGradient(-21, 0, 21, 0);
  body.addColorStop(0, '#6e0f22');
  body.addColorStop(0.26, '#c8263c');
  body.addColorStop(0.5, '#ff6b4a');
  body.addColorStop(0.74, '#c8263c');
  body.addColorStop(1, '#6e0f22');
  c.fillStyle = body;
  c.beginPath();
  c.ellipse(0, 0, 21, 25, 0, 0, Math.PI * 2);
  c.fill();

  // 竹骨（经线）
  c.strokeStyle = 'rgba(255, 214, 150, .26)';
  c.lineWidth = 0.9;
  for (let i = -2; i <= 2; i++) {
    const k = i / 2;
    c.beginPath();
    c.moveTo(0, -24.5);
    c.bezierCurveTo(k * 30, -14, k * 30, 14, 0, 24.5);
    c.stroke();
  }

  // 侧面反光
  c.fillStyle = 'rgba(255, 226, 170, .16)';
  c.beginPath();
  c.ellipse(-6.5, -3, 6.5, 15, -0.16, 0, Math.PI * 2);
  c.fill();

  // 字
  c.fillStyle = '#ffe8a6';
  c.font = '700 15px "Microsoft YaHei", sans-serif';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText(phase > 0 ? '市' : '夜', 0, 1);

  // 穗子
  c.strokeStyle = '#e0a444';
  c.lineWidth = 1.4;
  c.beginPath();
  c.moveTo(0, 27);
  c.lineTo(0, 35);
  c.stroke();
  c.strokeStyle = 'rgba(255, 196, 110, .75)';
  c.lineWidth = 1;
  for (let i = -2; i <= 2; i++) {
    c.beginPath();
    c.moveTo(0, 35);
    c.quadraticCurveTo(i * 1.7, 42, i * 2.8, 47);
    c.stroke();
  }
  c.restore();
}

let skyGradient = null;
let vignetteGradient = null;

function drawSky(c) {
  if (!skyGradient) {
    skyGradient = c.createLinearGradient(0, 0, 0, H);
    skyGradient.addColorStop(0, '#050915');
    skyGradient.addColorStop(0.34, '#0c1633');
    skyGradient.addColorStop(0.62, '#221238');
    skyGradient.addColorStop(0.86, '#3a1230');
    skyGradient.addColorStop(1, '#4a1526');
  }
  c.fillStyle = skyGradient;
  c.fillRect(0, 0, W, H);
}

function drawMoon(c, x, y, r) {
  const halo = c.createRadialGradient(x, y, r * 0.5, x, y, r * 3.4);
  halo.addColorStop(0, 'rgba(255, 236, 176, .20)');
  halo.addColorStop(0.45, 'rgba(255, 214, 150, .07)');
  halo.addColorStop(1, 'rgba(255, 200, 140, 0)');
  c.fillStyle = halo;
  c.beginPath();
  c.arc(x, y, r * 3.4, 0, Math.PI * 2);
  c.fill();

  c.fillStyle = '#ffeaa9';
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.fill();

  c.fillStyle = 'rgba(214, 170, 92, .22)';
  c.beginPath();
  c.arc(x - r * 0.26, y - r * 0.12, r * 0.24, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.arc(x + r * 0.30, y + r * 0.30, r * 0.15, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.arc(x + r * 0.16, y - r * 0.42, r * 0.10, 0, Math.PI * 2);
  c.fill();
}

function drawSkyline(c) {
  const far = [
    [0, 316, 42, 44], [36, 298, 52, 62], [84, 330, 34, 30],
    [112, 306, 60, 54], [168, 324, 42, 36], [204, 294, 60, 66],
    [258, 318, 38, 42], [290, 302, 70, 58],
  ];
  c.fillStyle = '#0b1229';
  for (const b of far) c.fillRect(b[0], b[1], b[2], b[3]);

  const win = [
    [12, 330], [22, 330], [14, 340],
    [48, 312], [58, 324], [48, 336],
    [126, 320], [136, 332], [146, 320],
    [218, 310], [228, 322], [218, 336],
    [304, 316], [314, 328], [304, 340],
  ];
  c.fillStyle = 'rgba(255, 189, 112, .5)';
  for (const p of win) c.fillRect(p[0], p[1], 2.6, 3.2);
}

function drawRoof(c, x, y, w, h, body, rim) {
  c.fillStyle = body;
  c.beginPath();
  c.moveTo(x, y + h * 0.58);
  c.quadraticCurveTo(x + w * 0.14, y + h * 0.16, x + w * 0.3, y);
  c.lineTo(x + w * 0.7, y);
  c.quadraticCurveTo(x + w * 0.86, y + h * 0.16, x + w, y + h * 0.58);
  c.lineTo(x + w, y + h);
  c.lineTo(x, y + h);
  c.closePath();
  c.fill();

  c.strokeStyle = 'rgba(0, 0, 0, .20)';
  c.lineWidth = 0.8;
  for (let i = 1; i < 7; i++) {
    const t = i / 7;
    const px = x + w * t;
    const topY = t > 0.3 && t < 0.7 ? y : y + h * 0.2;
    c.beginPath();
    c.moveTo(px, topY);
    c.lineTo(px, y + h);
    c.stroke();
  }

  c.strokeStyle = rim;
  c.lineWidth = 1.3;
  c.beginPath();
  c.moveTo(x, y + h * 0.58);
  c.quadraticCurveTo(x + w * 0.14, y + h * 0.16, x + w * 0.3, y);
  c.lineTo(x + w * 0.7, y);
  c.quadraticCurveTo(x + w * 0.86, y + h * 0.16, x + w, y + h * 0.58);
  c.stroke();
}

function drawStringLights(c, x0, y0, x1, y1, sag, time, count) {
  const pts = [];
  for (let i = 0; i <= count; i++) {
    const t = i / count;
    pts.push([
      x0 + (x1 - x0) * t,
      y0 + (y1 - y0) * t + Math.sin(Math.PI * t) * sag,
    ]);
  }

  c.strokeStyle = 'rgba(12, 8, 22, .7)';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.stroke();

  for (let i = 1; i < pts.length - 1; i++) {
    const x = pts[i][0];
    const y = pts[i][1];
    const tw = 0.65 + 0.35 * Math.sin(time / 700 + i * 1.9);
    c.fillStyle = 'rgba(255, 178, 100, ' + (0.10 * tw).toFixed(3) + ')';
    c.beginPath();
    c.arc(x, y + 3.5, 9, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = 'rgba(255, 214, 140, ' + (0.20 * tw).toFixed(3) + ')';
    c.beginPath();
    c.arc(x, y + 3.5, 4.2, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = 'rgba(255, 240, 200, ' + (0.55 + 0.45 * tw).toFixed(3) + ')';
    c.beginPath();
    c.arc(x, y + 3.5, 1.5, 0, Math.PI * 2);
    c.fill();
  }
}

function drawFloor(c) {
  const g = c.createLinearGradient(0, 600, 0, 640);
  g.addColorStop(0, '#3a1b21');
  g.addColorStop(0.22, '#25121b');
  g.addColorStop(1, '#0c0710');
  c.fillStyle = g;
  c.fillRect(0, 600, W, 40);

  const warm = c.createLinearGradient(0, 594, 0, 620);
  warm.addColorStop(0, 'rgba(255, 128, 76, .30)');
  warm.addColorStop(1, 'rgba(255, 128, 76, 0)');
  c.fillStyle = warm;
  c.fillRect(0, 594, W, 26);

  c.strokeStyle = 'rgba(255, 178, 118, .07)';
  c.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const y = 610 + i * 8;
    c.beginPath();
    c.moveTo(0, y);
    c.bezierCurveTo(W * 0.32, y - 1.6, W * 0.68, y + 1.4, W, y - 0.6);
    c.stroke();
  }
}

function drawNightMarket(time) {
  drawSky(ctx);

  for (const s of STARS) {
    ctx.globalAlpha = s.a * (0.75 + 0.25 * Math.sin(time / 900 + s.ph));
    ctx.fillStyle = '#e8f4ff';
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  drawMoon(ctx, 296, 96, 26);
  drawSkyline(ctx);

  drawRoof(ctx, -34, 348, 196, 66, '#0e0c26', 'rgba(255, 150, 96, .30)');
  drawRoof(ctx, 190, 332, 210, 74, '#100d2a', 'rgba(255, 150, 96, .26)');

  drawStringLights(ctx, -8, 62, 368, 84, 26, time, 11);
  drawStringLights(ctx, -8, 130, 368, 116, 32, time, 9);

  // 摊位的暖光从下方渗上来
  const baseGlow = ctx.createRadialGradient(W / 2, 612, 24, W / 2, 612, 286);
  baseGlow.addColorStop(0, 'rgba(255, 132, 78, .16)');
  baseGlow.addColorStop(0.55, 'rgba(255, 112, 70, .06)');
  baseGlow.addColorStop(1, 'rgba(255, 110, 70, 0)');
  ctx.fillStyle = baseGlow;
  ctx.fillRect(0, 330, W, 310);

  drawFireflies(ctx, time);

  drawLantern(ctx, 30, 226, 0, time, 1.02);
  drawLantern(ctx, 331, 198, Math.PI, time, 0.86);

  drawFloor(ctx);

  // 底部压暗，把视线收回来
  const ground = ctx.createLinearGradient(0, 540, 0, 640);
  ground.addColorStop(0, 'rgba(0, 0, 0, 0)');
  ground.addColorStop(1, 'rgba(0, 0, 0, .34)');
  ctx.fillStyle = ground;
  ctx.fillRect(0, 540, W, 100);

  const fog = ctx.createLinearGradient(0, 470, 0, 640);
  fog.addColorStop(0, 'rgba(78, 96, 138, 0)');
  fog.addColorStop(0.6, 'rgba(86, 108, 158, .06)');
  fog.addColorStop(1, 'rgba(96, 120, 170, .12)');
  ctx.fillStyle = fog;
  ctx.fillRect(0, 470, W, 170);

  if (!vignetteGradient) {
    vignetteGradient = ctx.createRadialGradient(
      W / 2, H * 0.46, H * 0.28,
      W / 2, H * 0.5, H * 0.8,
    );
    vignetteGradient.addColorStop(0, 'rgba(0, 0, 0, 0)');
    vignetteGradient.addColorStop(1, 'rgba(0, 0, 0, .40)');
  }
  ctx.fillStyle = vignetteGradient;
  ctx.fillRect(0, 0, W, H);
}

function drawTray(c, block, moving) {
  const x = block.x + 1;
  const y = block.y + block.h - 7;
  const w = Math.max(2, block.w - 2);

  c.fillStyle = '#4a2a15';
  roundRectPath(c, x, y, w, 7, 2.4);
  c.fill();

  c.fillStyle = 'rgba(214, 150, 92, .45)';
  c.fillRect(x + 1.5, y + 1, Math.max(0, w - 3), 1.6);

  c.strokeStyle = 'rgba(12, 5, 7, .55)';
  c.lineWidth = 0.9;
  roundRectPath(c, x, y, w, 7, 2.4);
  c.stroke();

  c.strokeStyle = moving ? 'rgba(255, 216, 156, .85)' : 'rgba(255, 196, 134, .35)';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(x + 2.5, y + 0.9);
  c.lineTo(x + w - 2.5, y + 0.9);
  c.stroke();
}

function drawTanghulu(c, block, moving) {
  const left = block.x + 3;
  const right = block.x + block.w - 3;
  const top = block.y + 3;
  const bottom = block.y + block.h - 7;
  const cy = (top + bottom) / 2 + 0.5;
  const count = Math.max(2, Math.round(block.w / 16));
  const gap = (right - left) / count;
  const r = Math.max(3, Math.min(7.8, gap * 0.5, (bottom - top) * 0.46));

  // 竹签：两端露出来，才像"串"
  c.strokeStyle = 'rgba(233, 199, 146, .85)';
  c.lineWidth = 1.4;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(left - 4.5, cy + 2.4);
  c.lineTo(right + 4.5, cy + 2.4);
  c.stroke();
  c.fillStyle = 'rgba(255, 236, 190, .5)';
  c.beginPath();
  c.arc(right + 4.5, cy + 2.4, 1.1, 0, Math.PI * 2);
  c.fill();

  for (let i = 0; i < count; i++) {
    const x = left + gap * (i + 0.5);
    const jitter = hash01(block.y * 0.11 + i * 7.13) - 0.5;
    const rr = r * (1 + jitter * 0.14);
    const yy = cy + jitter * 0.8;

    // 落在托盘上的投影
    c.fillStyle = 'rgba(70, 8, 20, .28)';
    c.beginPath();
    c.ellipse(x, yy + rr * 0.66, rr * 0.82, rr * 0.34, 0, 0, Math.PI * 2);
    c.fill();

    // 糖衣
    c.fillStyle = '#cf1f38';
    c.beginPath();
    c.arc(x, yy, rr, 0, Math.PI * 2);
    c.fill();

    // 底部的暗面，给球体一点体积
    c.strokeStyle = 'rgba(112, 14, 30, .45)';
    c.lineWidth = Math.max(1, rr * 0.24);
    c.beginPath();
    c.arc(x, yy, rr * 0.82, Math.PI * 0.18, Math.PI * 0.82);
    c.stroke();

    // 糖壳高光
    c.strokeStyle = 'rgba(255, 248, 228, .82)';
    c.lineWidth = Math.max(0.8, rr * 0.15);
    c.beginPath();
    c.arc(x, yy, rr * 0.66, Math.PI * 1.08, Math.PI * 1.5);
    c.stroke();

    // 反光点
    c.fillStyle = 'rgba(255, 255, 255, .78)';
    c.beginPath();
    c.arc(x - rr * 0.32, yy - rr * 0.38, Math.max(0.6, rr * 0.12), 0, Math.PI * 2);
    c.fill();

    // 轮廓
    c.strokeStyle = moving ? 'rgba(255, 226, 160, .9)' : 'rgba(74, 8, 22, .55)';
    c.lineWidth = moving ? 1.3 : 0.8;
    c.beginPath();
    c.arc(x, yy, rr, 0, Math.PI * 2);
    c.stroke();
  }
}

function drawEggette(c, block, moving) {
  const left = block.x + 3;
  const right = block.x + block.w - 3;
  const top = block.y + 3;
  const bottom = block.y + block.h - 7;
  const h = Math.max(9, bottom - top);

  // 一片片鸡蛋仔：比一整条更像个"饼"
  const count = Math.max(1, Math.round(block.w / 30));
  const slot = (right - left) / count;
  const pieceW = Math.max(10, Math.min(30, slot * 0.86));
  const pieceH = Math.min(h, pieceW * 0.74);

  for (let i = 0; i < count; i++) {
    const cx = left + slot * (i + 0.5);
    const x = cx - pieceW / 2;
    const y = bottom - pieceH;
    const rad = Math.min(5, pieceH / 3);

    // 落在托盘上的薄影
    c.fillStyle = 'rgba(60, 8, 14, .20)';
    c.fillRect(x + 1.5, bottom - 1.2, pieceW - 3, 1.4);

    // 外皮
    c.fillStyle = '#a9651a';
    roundRectPath(c, x, y, pieceW, pieceH, rad);
    c.fill();

    // 内芯
    c.fillStyle = '#e9ab3d';
    roundRectPath(c, x + 1.2, y + 1.2, pieceW - 2.4, pieceH - 2.4, Math.max(1, rad - 1));
    c.fill();

    // 顶部受光
    c.fillStyle = 'rgba(255, 226, 146, .45)';
    roundRectPath(c, x + 2, y + 1.8, pieceW - 4, Math.max(2, pieceH * 0.22), Math.max(1, rad - 2));
    c.fill();

    // 蛋坑
    const cols = pieceW > 21 ? 2 : 1;
    const rows = pieceH > 15 ? 2 : 1;
    const cw = pieceW / cols;
    const chh = pieceH / rows;
    for (let r = 0; r < rows; r++) {
      for (let k = 0; k < cols; k++) {
        const bx = x + cw * (k + 0.5);
        const by = y + chh * (r + 0.5) + 0.6;
        const rx = Math.min(4.8, cw * 0.33);
        const ry = Math.min(4.0, chh * 0.31);

        c.fillStyle = 'rgba(140, 76, 14, .58)';
        c.beginPath();
        c.ellipse(bx, by, rx, ry, 0, 0, Math.PI * 2);
        c.fill();

        c.strokeStyle = 'rgba(255, 224, 154, .7)';
        c.lineWidth = 0.8;
        c.beginPath();
        c.ellipse(bx, by, rx, ry, 0, Math.PI * 1.1, Math.PI * 1.9);
        c.stroke();
      }
    }

    // 轮廓
    c.strokeStyle = moving ? '#ffe6a0' : 'rgba(108, 54, 10, .72)';
    c.lineWidth = moving ? 1.6 : 1;
    roundRectPath(c, x, y, pieceW, pieceH, rad);
    c.stroke();
  }
}

function drawCup(c, cx, baseY, w, h, moving) {
  const topY = baseY - h;
  const halfTop = w * 0.44;
  const halfBottom = w * 0.33;

  // 落在托盘上的薄影
  c.fillStyle = 'rgba(60, 8, 14, .20)';
  c.beginPath();
  c.ellipse(cx, baseY - 0.4, halfBottom * 1.2, 1.6, 0, 0, Math.PI * 2);
  c.fill();

  // 玻璃杯身
  c.beginPath();
  c.moveTo(cx - halfTop, topY);
  c.lineTo(cx + halfTop, topY);
  c.lineTo(cx + halfBottom, baseY);
  c.lineTo(cx - halfBottom, baseY);
  c.closePath();
  c.fillStyle = 'rgba(226, 246, 255, .14)';
  c.fill();

  // 茶汤、冰块与泡在里面的柠檬片
  c.save();
  c.clip();
  const teaTop = topY + h * 0.34;
  c.fillStyle = 'rgba(255, 232, 150, .42)';
  c.fillRect(cx - w, teaTop, w * 2, h);
  c.fillStyle = 'rgba(255, 246, 190, .28)';
  c.fillRect(cx - w, teaTop, w * 2, h * 0.16);
  c.fillStyle = 'rgba(236, 252, 255, .45)';
  c.fillRect(cx - w * 0.26, teaTop + h * 0.22, w * 0.22, h * 0.20);
  c.fillRect(cx + w * 0.02, teaTop + h * 0.46, w * 0.20, h * 0.18);

  const slice = Math.max(1.8, w * 0.15);
  c.fillStyle = 'rgba(255, 221, 85, .85)';
  for (let k = 0; k < 2; k++) {
    const lx = cx + (k === 0 ? -w * 0.16 : w * 0.18);
    const lyy = teaTop + h * (k === 0 ? 0.20 : 0.64);
    c.beginPath();
    c.arc(lx, lyy, slice, 0, Math.PI * 2);
    c.fill();
  }
  c.restore();

  // 半球杯盖
  c.fillStyle = 'rgba(220, 244, 252, .16)';
  c.strokeStyle = 'rgba(226, 248, 255, .55)';
  c.lineWidth = 0.9;
  c.beginPath();
  c.ellipse(cx, topY, halfTop * 0.96, h * 0.16, 0, Math.PI, Math.PI * 2);
  c.fill();
  c.stroke();
  c.beginPath();
  c.moveTo(cx - halfTop, topY);
  c.lineTo(cx + halfTop, topY);
  c.stroke();

  // 杯沿的柠檬片
  const lr = Math.max(2.2, w * 0.16);
  const lx0 = cx - halfTop * 0.58;
  const ly0 = topY + 0.5;
  c.fillStyle = '#ffdd55';
  c.beginPath();
  c.arc(lx0, ly0, lr, 0, Math.PI * 2);
  c.fill();
  c.strokeStyle = 'rgba(255, 252, 220, .9)';
  c.lineWidth = 0.8;
  c.stroke();
  c.strokeStyle = 'rgba(214, 156, 38, .5)';
  c.lineWidth = 0.5;
  for (let a = 0; a < 3; a++) {
    const ang = a * Math.PI / 3 + 1.1;
    c.beginPath();
    c.moveTo(lx0, ly0);
    c.lineTo(lx0 + Math.cos(ang) * lr * 0.78, ly0 + Math.sin(ang) * lr * 0.78);
    c.stroke();
  }

  // 吸管
  if (w > 15) {
    c.strokeStyle = '#ff6f8e';
    c.lineWidth = Math.max(1.4, w * 0.09);
    c.beginPath();
    c.moveTo(cx + w * 0.12, topY - 1);
    c.lineTo(cx + w * 0.30, topY - h * 0.20);
    c.stroke();
  }

  // 轮廓
  c.strokeStyle = moving ? 'rgba(196, 250, 255, .95)' : 'rgba(176, 220, 232, .5)';
  c.lineWidth = moving ? 1.4 : 0.9;
  c.beginPath();
  c.moveTo(cx - halfTop, topY);
  c.lineTo(cx + halfTop, topY);
  c.lineTo(cx + halfBottom, baseY);
  c.lineTo(cx - halfBottom, baseY);
  c.closePath();
  c.stroke();

  // 侧面高光
  c.strokeStyle = 'rgba(255, 255, 255, .55)';
  c.lineWidth = 1;
  c.beginPath();
  c.moveTo(cx - halfTop * 0.60, topY + h * 0.22);
  c.lineTo(cx - halfBottom * 0.64, baseY - h * 0.16);
  c.stroke();
}

function drawLemonTea(c, block, moving) {
  const pad = 3;
  const left = block.x + pad;
  const right = block.x + block.w - pad;
  const baseY = block.y + block.h - 7;
  const h = Math.max(9, Math.min(20, block.h - 10));

  const count = Math.max(1, Math.round(block.w / 30));
  const slot = (right - left) / count;
  const cupW = Math.max(8, Math.min(24, slot * 0.8));
  const cupH = Math.min(h, cupW * 0.95);

  for (let i = 0; i < count; i++) {
    drawCup(c, left + slot * (i + 0.5), baseY, cupW, cupH, moving);
  }
}

function drawSnack(c, block, moving) {
  if (moving) {
    const cx = block.x + block.w / 2;
    const cy = block.y + block.h / 2;
    const radius = Math.max(block.w, 60) * 0.8;
    const glow = c.createRadialGradient(cx, cy, 4, cx, cy, radius);
    glow.addColorStop(0, 'rgba(255, 190, 110, .18)');
    glow.addColorStop(1, 'rgba(255, 150, 90, 0)');
    c.fillStyle = glow;
    c.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);

    const drop = c.createLinearGradient(0, block.y + block.h, 0, block.y + block.h + 16);
    drop.addColorStop(0, 'rgba(0, 0, 0, .30)');
    drop.addColorStop(1, 'rgba(0, 0, 0, 0)');
    c.fillStyle = drop;
    c.fillRect(block.x - 3, block.y + block.h, block.w + 6, 16);
  }

  drawTray(c, block, moving);

  if (block.kind === 'tanghulu') drawTanghulu(c, block, moving);
  else if (block.kind === 'lemonTea') drawLemonTea(c, block, moving);
  else drawEggette(c, block, moving);

  // 托盘压在下层小吃上的阴影
  c.fillStyle = 'rgba(6, 2, 8, .30)';
  c.fillRect(block.x, block.y + block.h, block.w, 2.2);
}

// ===== 5. 主循环 =====
let last = 0;
function loop(t) {
  const dt = Math.min(0.05, (t - last) / 1000 || 0);
  last = t;

  if (state && state.mode === 'playing') {
    const cur = state.current;
    cur.x += cur.dir * state.speed * dt;
    if (cur.x < 0) { cur.x = 0; cur.dir = 1; }
    if (cur.x + cur.w > W) { cur.x = W - cur.w; cur.dir = -1; }
  }

  draw(t);
  updateParticles(dt);
  drawParticles();
  requestAnimationFrame(loop);
}

const IDLE_BLOCKS = [
  { x: 96, y: H - 60, w: 168, h: CONFIG.blockH, kind: 'tanghulu' },
  { x: 108, y: H - 88, w: 144, h: CONFIG.blockH, kind: 'eggette' },
  { x: 118, y: H - 116, w: 124, h: CONFIG.blockH, kind: 'lemonTea' },
  { x: 128, y: H - 144, w: 104, h: CONFIG.blockH, kind: 'tanghulu' },
];

function draw(time) {
  ctx.clearRect(0, 0, W, H);
  drawNightMarket(time);
  if (!state) {
    // 开始页：底部摆一组静态小吃，当作摊位展示
    for (const b of IDLE_BLOCKS) drawSnack(ctx, b, false);
    return;
  }

  ctx.save();
  ctx.translate(0, state.cameraY);   // 镜头跟随牌堆向上

  // 已叠好的块
  for (const b of state.blocks) {
    drawSnack(ctx, b, false);
  }

  // 当前块
  if (state.mode === 'playing') {
    drawSnack(ctx, state.current, true);
  }

  ctx.restore();
}

// ===== 6. 自适应缩放（保持 9:16，不变形） =====
function fitCanvas() {
  const wrapStyle = getComputedStyle(wrap);
  const safeWidth =
    wrap.clientWidth -
    parseFloat(wrapStyle.paddingLeft) -
    parseFloat(wrapStyle.paddingRight);
  const safeHeight =
    wrap.clientHeight -
    parseFloat(wrapStyle.paddingTop) -
    parseFloat(wrapStyle.paddingBottom);
  const scale = Math.max(0.1, Math.min(safeWidth / W, safeHeight / H));
  stage.style.width = (W * scale) + 'px';
  stage.style.height = (H * scale) + 'px';
  pixelRatio = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
  const pixelWidth = Math.round(W * pixelRatio);
  const pixelHeight = Math.round(H * pixelRatio);
  for (const surface of [canvas, fxCanvas]) {
    if (surface.width !== pixelWidth || surface.height !== pixelHeight) {
      surface.width = pixelWidth;
      surface.height = pixelHeight;
    }
  }
  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
  fxCtx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
}
window.addEventListener('resize', fitCanvas);
fitCanvas();

// ===== 7. 启动 =====
// 开始页只画夜景，不画牌堆；点击"开始"后 reset() 才建立状态。
state = null;
requestAnimationFrame(loop);
</script>
